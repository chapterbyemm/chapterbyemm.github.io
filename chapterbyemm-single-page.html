<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChapterByEmm — Printed T-Shirts Pakistan | Every Design Begins a New Chapter</title>
<meta name="description" content="ChapterByEmm designs and prints premium T-shirts, made to order and shipped across Pakistan with Cash on Delivery.">
<meta name="theme-color" content="#f3efe6">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   ChapterByEmm — global stylesheet
   --------------------------------------------------------------------------
   1. Design tokens (edit colours / fonts / spacing here)
   2. Base + typography
   3. Layout helpers
   4. Buttons, forms, badges
   5. Header, nav, cart drawer
   6. Hero + homepage sections
   7. Product cards + grids
   8. Shop filters
   9. Product detail page
   10. Cart + checkout
   11. Static pages (about, FAQ, contact, custom)
   12. Footer
   13. Animations + responsive
   ========================================================================== */

/* 1. DESIGN TOKENS ======================================================== */
:root {
  /* Brand palette — drawn from the ChapterByEmm logo: warm ivory, terracotta,
     muted teal, deep navy and soft sand. Change these to re-skin the site. */
  --cream: #f3efe6;      /* warm ivory — primary canvas */
  --cream-2: #ecE4d5;    /* deeper ivory — tinted sections */
  --sand: #ddba8a;       /* soft sand — subtle supporting accent */
  --sand-2: #c9a268;     /* deeper sand — hover states */
  --clay: #c86d5b;       /* terracotta — CTAs, badges, highlights */
  --rose: #d98f7e;       /* lighter terracotta — small accents */
  --sage: #347b7b;       /* muted teal — secondary accent */
  --ink: #173e47;        /* deep navy — primary text, dark surfaces */
  --ink-soft: #2c525c;   /* secondary navy text */
  --muted: #6e7a78;      /* muted teal-grey — captions, metadata */
  --line: #e1d6c2;       /* warm hairline */
  --white: #ffffff;
  --success: #3e7a5c;
  --error: #b0483a;

  /* Type — an editorial serif display face paired with a clean, modern sans */
  --font-display: "Fraunces", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  /* Scale */
  --step--1: clamp(0.78rem, 0.76rem + 0.1vw, 0.86rem);
  --step-0: clamp(0.95rem, 0.92rem + 0.15vw, 1.05rem);
  --step-1: clamp(1.15rem, 1.05rem + 0.4vw, 1.4rem);
  --step-2: clamp(1.5rem, 1.3rem + 1vw, 2.1rem);
  --step-3: clamp(2rem, 1.6rem + 2vw, 3rem);
  --step-4: clamp(2.6rem, 1.8rem + 4.5vw, 5.4rem);

  /* Space + shape — restrained radii and quiet shadows; an editorial brand,
     not a rounded "app" aesthetic */
  --gap: clamp(1rem, 0.6rem + 1.5vw, 1.75rem);
  --section-y: clamp(3.5rem, 2rem + 6vw, 7rem);
  --shell: 1280px;
  --radius: 3px;
  --radius-lg: 8px;
  --radius-pill: 3px;
  --shadow-sm: 0 1px 2px rgba(23, 62, 71, 0.05), 0 3px 12px rgba(23, 62, 71, 0.04);
  --shadow-md: 0 10px 32px rgba(23, 62, 71, 0.12);
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

/* 2. BASE ================================================================= */
*,
*::before,
*::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  overflow-x: clip; /* `clip`, not `hidden`, so the sticky header still sticks */
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body.no-scroll { overflow: hidden; }

img, svg { max-width: 100%; height: auto; display: block; }

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-optical-sizing: auto;
  font-weight: 500;
  line-height: 1.12;
  letter-spacing: -0.01em;
  text-wrap: balance;
  margin: 0 0 0.5em;
}

h1 { font-size: var(--step-4); }
h2 { font-size: var(--step-3); }
h3 { font-size: var(--step-1); }

p { margin: 0 0 1em; }
p:last-child { margin-bottom: 0; }

a { color: inherit; text-decoration: none; }

/* prose links get a soft underline… */
a:not([class]) {
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  text-decoration-color: var(--clay);
}

/* …but links that are part of a UI component stay clean */
.product-card a,
.collection-card a,
.mini-item a,
.line-item a,
.breadcrumbs a,
.footer-grid a,
.social-list a,
.thumbs a { text-decoration: none; }

.breadcrumbs a:hover,
.footer-grid a:hover,
.social-list a:hover { text-decoration: underline; text-underline-offset: 3px; }

:focus-visible {
  outline: 2px solid var(--clay);
  outline-offset: 3px;
  border-radius: 4px;
}

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.skip-link {
  position: fixed;
  top: 0.5rem; left: 0.5rem;
  z-index: 999;
  padding: 0.7rem 1.1rem;
  background: var(--ink);
  color: var(--cream);
  border-radius: var(--radius-pill);
  transform: translateY(-160%);
  transition: transform 0.25s var(--ease);
}
.skip-link:focus { transform: translateY(0); }

/* 3. LAYOUT =============================================================== */
.shell {
  width: 100%;
  max-width: var(--shell);
  margin-inline: auto;
  padding-inline: clamp(1.15rem, 0.6rem + 2.5vw, 3rem);
}

.section { padding-block: var(--section-y); }
.section--tint { background: var(--cream-2); }
.section--sand { background: var(--sand); }
.section--ink { background: var(--ink); color: var(--cream); }
.section--ink .eyebrow, .section--ink .lede { color: rgba(243, 239, 230, 0.72); }

.section-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: clamp(1.75rem, 1rem + 2vw, 3rem);
}
.section-head > div { max-width: 60ch; }
.section-head--center { flex-direction: column; align-items: center; text-align: center; }

.eyebrow {
  display: block;
  font-size: var(--step--1);
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.9rem;
}

.lede { font-size: var(--step-1); color: var(--ink-soft); line-height: 1.55; }
.muted { color: var(--muted); }
.center { text-align: center; }

.grid { display: grid; gap: var(--gap); }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid--3 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid--4 { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

.rule { height: 1px; background: var(--line); border: 0; margin: 0; }

/* 4. BUTTONS / FORMS ====================================================== */
.btn {
  --btn-bg: var(--ink);
  --btn-fg: var(--cream);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.55rem;
  padding: 0.95rem 1.9rem;
  min-height: 48px;
  border: 1px solid var(--btn-bg);
  border-radius: var(--radius-pill);
  background: var(--btn-bg);
  color: var(--btn-fg);
  font: inherit;
  font-size: var(--step--1);
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform 0.25s var(--ease), background 0.25s var(--ease),
    color 0.25s var(--ease), box-shadow 0.25s var(--ease);
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.btn:active { transform: translateY(0); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.btn--ghost { --btn-bg: transparent; --btn-fg: var(--ink); border-color: var(--ink); }
.btn--ghost:hover { background: var(--ink); color: var(--cream); }
.btn--light { --btn-bg: var(--cream); --btn-fg: var(--ink); }
.btn--clay { --btn-bg: var(--clay); --btn-fg: var(--white); }
.btn--sm { padding: 0.6rem 1.15rem; min-height: 40px; font-size: 0.72rem; }
.btn--block { width: 100%; }

.link-arrow {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: var(--step--1);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border-bottom: 1px solid currentColor;
  padding-bottom: 0.3rem;
  transition: gap 0.25s var(--ease);
}
.link-arrow:hover { gap: 0.95rem; }

label { display: block; font-size: var(--step--1); letter-spacing: 0.06em; margin-bottom: 0.4rem; color: var(--ink-soft); }

input, select, textarea {
  width: 100%;
  padding: 0.85rem 1rem;
  font: inherit;
  font-size: var(--step-0);
  color: var(--ink);
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 10px;
  transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
}
input:focus, select:focus, textarea:focus {
  border-color: var(--clay);
  box-shadow: 0 0 0 3px rgba(200, 109, 91, 0.18);
  outline: none;
}
textarea { min-height: 140px; resize: vertical; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 20px) calc(50% + 2px), calc(100% - 15px) calc(50% + 2px); background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

.field { margin-bottom: 1.1rem; }
.field-row { display: grid; gap: 1.1rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.hint { font-size: var(--step--1); color: var(--muted); margin-top: 0.4rem; }
.form-note { font-size: var(--step--1); color: var(--muted); }

.form-status {
  display: none;
  margin-top: 1rem;
  padding: 0.9rem 1.1rem;
  border-radius: 10px;
  background: rgba(62, 122, 92, 0.12);
  color: var(--success);
  font-size: var(--step--1);
}
.form-status.is-visible { display: block; animation: fade-up 0.4s var(--ease); }

.badge {
  display: inline-block;
  padding: 0.3rem 0.7rem;
  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--cream);
  font-size: 0.65rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.badge--clay { background: var(--clay); }
.badge--sage { background: var(--sage); color: var(--ink); }

/* 5. HEADER =============================================================== */
.announce {
  background: var(--ink);
  color: var(--cream);
  text-align: center;
  font-size: var(--step--1);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 0.6rem 1rem;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 60;
  background: rgba(243, 239, 230, 0.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.site-header.is-stuck { border-color: var(--line); box-shadow: 0 6px 24px rgba(23, 62, 71, 0.06); }

.header-inner {
  display: flex;
  align-items: center;
  gap: 1rem;
  min-height: 74px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-family: var(--font-display);
  font-size: 1.35rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  white-space: nowrap;
  margin-right: auto;
}
.brand small { display: block; font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.3em; color: var(--muted); }

/* logo mark — sits beside the wordmark; removes itself if the file is missing */
.brand-mark {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--cream-2);
}
.brand-mark--footer { width: 52px; height: 52px; }
.footer-brand .brand { gap: 0.7rem; text-transform: none; letter-spacing: 0.12em; }

.nav { display: flex; align-items: center; gap: clamp(0.8rem, 0.2rem + 1vw, 1.9rem); }
.nav a {
  position: relative;
  font-size: var(--step--1);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding-block: 0.4rem;
}
.nav a::after {
  content: "";
  position: absolute;
  left: 0; bottom: 0;
  width: 100%; height: 1px;
  background: var(--ink);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s var(--ease);
}
.nav a:hover::after, .nav a[aria-current="page"]::after { transform: scaleX(1); }

.header-actions { display: flex; align-items: center; gap: 0.5rem; margin-left: auto; }

.icon-btn {
  position: relative;
  display: grid;
  place-items: center;
  width: 44px; height: 44px;
  border: 0;
  background: transparent;
  border-radius: 50%;
  cursor: pointer;
  color: var(--ink);
  transition: background 0.25s var(--ease);
}
.icon-btn:hover { background: var(--sand); }
.icon-btn svg { width: 20px; height: 20px; }

.count-bubble {
  position: absolute;
  top: 4px; right: 2px;
  min-width: 18px; height: 18px;
  padding: 0 4px;
  border-radius: var(--radius-pill);
  background: var(--clay);
  color: var(--white);
  font-size: 0.65rem;
  line-height: 18px;
  text-align: center;
}
.count-bubble[data-empty="true"] { display: none; }

.nav-toggle { display: none; }

/* Mobile nav panel */
.mobile-nav {
  position: fixed;
  inset: 0 0 0 auto;
  width: min(380px, 88vw);
  z-index: 80;
  background: var(--cream);
  padding: 1.5rem;
  transform: translateX(105%);
  transition: transform 0.4s var(--ease);
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  overflow-y: auto;
}
.mobile-nav.is-open { transform: translateX(0); box-shadow: var(--shadow-md); }
.mobile-nav a {
  font-family: var(--font-display);
  font-size: 1.5rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--line);
}
.mobile-nav .btn { margin-top: 1.25rem; }

/* Cart drawer */
.drawer {
  position: fixed;
  top: 0; right: 0;
  height: 100%;
  width: min(430px, 92vw);
  z-index: 80;
  background: var(--cream);
  display: flex;
  flex-direction: column;
  transform: translateX(105%);
  transition: transform 0.4s var(--ease);
}
.drawer.is-open { transform: translateX(0); box-shadow: var(--shadow-md); }
.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--line);
}
.drawer-head h2 { margin: 0; font-size: var(--step-1); }
.drawer-body { flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem; }
.drawer-foot { padding: 1.25rem 1.5rem; border-top: 1px solid var(--line); background: var(--cream-2); }

.overlay {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: rgba(23, 62, 71, 0.46);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s var(--ease), visibility 0.35s;
}
.overlay.is-open { opacity: 1; visibility: visible; }

.mini-item {
  display: grid;
  grid-template-columns: 78px 1fr auto;
  gap: 0.9rem;
  padding-bottom: 1rem;
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--line);
}
.mini-item:last-child { border-bottom: 0; }
.mini-item img { border-radius: 10px; background: var(--sand); }
.mini-item h3 { font-size: 1.05rem; margin-bottom: 0.15rem; }
.mini-item .meta { font-size: var(--step--1); color: var(--muted); }
.mini-item .price { font-variant-numeric: tabular-nums; }

.qty {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--white);
  overflow: hidden;
}
.qty button {
  width: 34px; height: 34px;
  border: 0;
  background: transparent;
  font-size: 1rem;
  cursor: pointer;
  color: var(--ink);
}
.qty button:hover { background: var(--sand); }
.qty input {
  width: 40px;
  border: 0;
  padding: 0;
  text-align: center;
  background: transparent;
  font-variant-numeric: tabular-nums;
}
.qty input:focus { box-shadow: none; }

.empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--muted); }

/* Toast */
.toast-stack {
  position: fixed;
  bottom: 1.25rem; left: 50%;
  transform: translateX(-50%);
  z-index: 120;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  width: min(420px, calc(100vw - 2rem));
}
.toast {
  background: var(--ink);
  color: var(--cream);
  padding: 0.85rem 1.1rem;
  border-radius: var(--radius);
  font-size: var(--step--1);
  box-shadow: var(--shadow-md);
  animation: fade-up 0.35s var(--ease);
}

/* 6. HERO + HOME ========================================================== */
.hero {
  position: relative;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  align-items: center;
  gap: clamp(1.5rem, 1rem + 3vw, 4rem);
  padding-block: clamp(3rem, 2rem + 5vw, 6.5rem);
}
.hero-copy { max-width: 40rem; }
.hero h1 {
  /* sized for the multi-word headline — text-wrap: balance (set globally on
     h1–h4) settles this into 2–3 even lines rather than one word per line */
  font-size: clamp(1.9rem, 1rem + 2.6vw, 3.4rem);
  letter-spacing: -0.01em;
  margin-bottom: 0.45em;
  overflow-wrap: break-word;
}
.hero .tagline {
  font-family: var(--font-display);
  font-size: var(--step-2);
  font-style: italic;
  color: var(--clay);
  margin-bottom: 0.7em;
}
.hero .intro { font-size: var(--step-1); color: var(--ink-soft); margin-bottom: 2rem; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 0.85rem; }
.hero-media { position: relative; }
.hero-media img {
  border-radius: var(--radius-lg);
  background: var(--sand);
  aspect-ratio: 4 / 5;
  object-fit: cover;
}
.hero-media .float-card {
  position: absolute;
  bottom: -1.25rem; left: -1.25rem;
  background: var(--cream);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 0.9rem 1.15rem;
  font-size: var(--step--1);
  max-width: 15rem;
}
.hero-media .float-card strong { display: block; font-family: var(--font-display); font-size: 1.1rem; }

.marquee {
  background: var(--ink);
  color: var(--cream);
  padding: 0.9rem 0;
  overflow: hidden;
}
.marquee-track {
  display: flex;
  gap: 3rem;
  width: max-content;
  animation: marquee 28s linear infinite;
  font-size: var(--step--1);
  letter-spacing: 0.24em;
  text-transform: uppercase;
}

.value-grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.value {
  padding: 1.5rem;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.value:hover { transform: translateY(-4px); box-shadow: var(--shadow-sm); }
.value h3 { font-size: 1.15rem; margin-bottom: 0.35rem; }
.value p { font-size: var(--step--1); color: var(--muted); }

/* Collections */
.collection-card {
  position: relative;
  display: block;
  overflow: hidden;
  border-radius: var(--radius-lg);
  background: var(--sand);
}
.collection-card img {
  aspect-ratio: 3 / 4;
  object-fit: cover;
  transition: transform 0.7s var(--ease);
}
.collection-card:hover img { transform: scale(1.06); }
.collection-card .overlay-text {
  position: absolute;
  inset: auto 0 0 0;
  padding: 1.5rem 1.25rem;
  background: linear-gradient(to top, rgba(23, 62, 71, 0.75), transparent);
  color: var(--cream);
}
.collection-card h3 { color: var(--cream); margin-bottom: 0.15rem; }
.collection-card p { font-size: var(--step--1); opacity: 0.85; }

/* Story */
.split {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: clamp(1.5rem, 1rem + 3vw, 4rem);
  align-items: center;
}
.split img { border-radius: var(--radius-lg); background: var(--sand); }
.signature { font-family: var(--font-display); font-style: italic; font-size: var(--step-1); color: var(--clay); }

/* Reviews */
.review {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.6rem;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}
.stars { color: var(--clay); letter-spacing: 0.18em; font-size: 0.95rem; }
.review blockquote { margin: 0; font-family: var(--font-display); font-size: var(--step-1); line-height: 1.45; }
.review cite { font-style: normal; font-size: var(--step--1); color: var(--muted); }

/* Instagram */
.ig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.6rem; }
.ig-grid a { position: relative; overflow: hidden; border-radius: var(--radius); }
.ig-grid img { aspect-ratio: 1; object-fit: cover; transition: transform 0.6s var(--ease), opacity 0.3s; }
.ig-grid a:hover img { transform: scale(1.08); opacity: 0.85; }

/* Newsletter */
.newsletter { text-align: center; }
.newsletter form {
  display: flex;
  gap: 0.6rem;
  max-width: 480px;
  margin: 1.5rem auto 0.75rem;
  flex-wrap: wrap;
}
.newsletter input { flex: 1 1 220px; border-radius: var(--radius-pill); padding-inline: 1.25rem; }

/* 7. PRODUCT CARDS ======================================================== */
.product-card {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
}
.product-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); }

.product-card .media { position: relative; overflow: hidden; background: var(--cream-2); }
.product-card .media img {
  aspect-ratio: 4 / 5;
  object-fit: cover;
  transition: opacity 0.45s var(--ease), transform 0.7s var(--ease);
}
.product-card .media img.alt-img { position: absolute; inset: 0; opacity: 0; }
.product-card:hover .media img.alt-img { opacity: 1; }
.product-card:hover .media img { transform: scale(1.03); }

.card-badges { position: absolute; top: 0.75rem; left: 0.75rem; display: flex; gap: 0.35rem; z-index: 2; }

.wish-btn {
  position: absolute;
  top: 0.6rem; right: 0.6rem;
  z-index: 2;
  width: 38px; height: 38px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: rgba(243, 239, 230, 0.92);
  cursor: pointer;
  color: var(--ink-soft);
  transition: transform 0.25s var(--ease), color 0.25s var(--ease);
}
.wish-btn:hover { transform: scale(1.12); }
.wish-btn svg { width: 18px; height: 18px; }
.wish-btn[aria-pressed="true"] { color: var(--clay); }
.wish-btn[aria-pressed="true"] svg { fill: currentColor; }

.product-card .body { padding: 1.1rem 1.15rem 1.3rem; display: flex; flex-direction: column; gap: 0.45rem; flex: 1; }
.product-card h3 { font-size: 1.2rem; margin: 0; }
.product-card h3 a:hover { color: var(--clay); }
.product-card .cat { font-size: var(--step--1); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.product-card .price { font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.product-card .desc { font-size: var(--step--1); color: var(--muted); }
.product-card .swatches { display: flex; gap: 0.35rem; margin-top: auto; padding-top: 0.4rem; }
.product-card .card-actions { display: flex; gap: 0.5rem; margin-top: 0.7rem; }
.product-card .card-actions .btn { flex: 1; }

.swatch {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: 1px solid rgba(23, 62, 71, 0.16);
  display: inline-block;
}

/* 8. SHOP FILTERS ========================================================= */
.page-head { padding-block: clamp(2.25rem, 1.5rem + 3vw, 4rem) clamp(1.5rem, 1rem + 2vw, 2.5rem); }
.breadcrumbs { font-size: var(--step--1); color: var(--muted); margin-bottom: 0.9rem; }
.breadcrumbs a:hover { color: var(--ink); }

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
  padding-bottom: 1.5rem;
}
.chip {
  padding: 0.55rem 1.05rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--white);
  font: inherit;
  font-size: var(--step--1);
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: background 0.25s var(--ease), color 0.25s var(--ease), border-color 0.25s var(--ease);
}
.chip:hover { border-color: var(--clay); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--cream); border-color: var(--ink); }

.shop-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding-bottom: 1.5rem;
}
.shop-toolbar .field { margin: 0; display: flex; align-items: center; gap: 0.5rem; }
.shop-toolbar label { margin: 0; white-space: nowrap; }
.shop-toolbar select { width: auto; min-width: 190px; }
.result-count { font-size: var(--step--1); color: var(--muted); }

/* 9. PRODUCT DETAIL ======================================================= */
.pdp { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: clamp(1.5rem, 1rem + 3vw, 4rem); align-items: start; }

.gallery { display: grid; gap: 0.75rem; }
.gallery-main {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-lg);
  background: var(--cream-2);
  cursor: zoom-in;
}
.gallery-main img { aspect-ratio: 4 / 5; object-fit: cover; transition: transform 0.45s var(--ease); }
.gallery-main.is-zoomed { cursor: zoom-out; }
.gallery-main.is-zoomed img { transform: scale(2); }
.zoom-hint {
  position: absolute;
  bottom: 0.75rem; right: 0.75rem;
  background: rgba(243, 239, 230, 0.92);
  border-radius: var(--radius-pill);
  padding: 0.35rem 0.8rem;
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  pointer-events: none;
}
.thumbs { display: flex; gap: 0.6rem; }
.thumbs button {
  flex: 0 0 84px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  background: var(--cream-2);
  cursor: pointer;
  transition: border-color 0.25s var(--ease);
}
.thumbs button[aria-current="true"] { border-color: var(--ink); }
.thumbs img { aspect-ratio: 1; object-fit: cover; }

.pdp-info .price-row { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 1rem; }
.pdp-info .price { font-size: var(--step-2); font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.pdp-info .compare { color: var(--muted); text-decoration: line-through; }

.option-group { margin-bottom: 1.35rem; }
.option-group .option-label {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: var(--step--1);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 0.6rem;
}
.option-group .option-label button { border: 0; background: none; padding: 0; font: inherit; text-transform: none; letter-spacing: 0; color: var(--muted); text-decoration: underline; cursor: pointer; }

.size-list, .color-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.size-opt {
  min-width: 52px;
  padding: 0.6rem 0.85rem;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--white);
  font: inherit;
  font-size: var(--step--1);
  cursor: pointer;
  transition: all 0.2s var(--ease);
}
.size-opt:hover { border-color: var(--ink); }
.size-opt[aria-pressed="true"] { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.size-opt[disabled] { opacity: 0.35; cursor: not-allowed; text-decoration: line-through; }

.color-opt {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.45rem 0.85rem 0.45rem 0.5rem;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--white);
  font: inherit;
  font-size: var(--step--1);
  cursor: pointer;
  transition: all 0.2s var(--ease);
}
.color-opt[aria-pressed="true"] { border-color: var(--ink); background: var(--cream-2); }

.pdp-actions { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-block: 1.5rem; }
.pdp-actions .btn { flex: 1 1 220px; }

.trust-list { list-style: none; padding: 0; margin: 0 0 1.5rem; display: grid; gap: 0.5rem; font-size: var(--step--1); color: var(--ink-soft); }
.trust-list li { display: flex; gap: 0.6rem; align-items: flex-start; }
.trust-list li::before { content: "—"; color: var(--clay); }

/* Accordion */
.accordion { border-top: 1px solid var(--line); }
.accordion details { border-bottom: 1px solid var(--line); }
.accordion summary {
  cursor: pointer;
  padding: 1.05rem 0;
  font-size: var(--step-0);
  letter-spacing: 0.04em;
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
}
.accordion summary::-webkit-details-marker { display: none; }
.accordion summary::after { content: "+"; font-size: 1.25rem; color: var(--clay); transition: transform 0.3s var(--ease); }
.accordion details[open] summary::after { transform: rotate(45deg); }
.accordion .panel { padding-bottom: 1.1rem; font-size: var(--step-0); color: var(--ink-soft); }
.accordion .panel ul { margin: 0; padding-left: 1.1rem; }

/* Size chart table */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: var(--step--1); min-width: 420px; }
th, td { text-align: left; padding: 0.7rem 0.8rem; border-bottom: 1px solid var(--line); }
th { font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

/* 10. CART + CHECKOUT ===================================================== */
.cart-layout, .checkout-layout {
  display: grid;
  grid-template-columns: 1.35fr 0.65fr;
  gap: clamp(1.5rem, 1rem + 3vw, 3.5rem);
  align-items: start;
}

.line-item {
  display: grid;
  grid-template-columns: 120px 1fr auto;
  gap: 1.1rem;
  padding: 1.25rem 0;
  border-bottom: 1px solid var(--line);
}
.line-item img { border-radius: var(--radius); background: var(--cream-2); }
.line-item h3 { font-size: 1.25rem; margin-bottom: 0.2rem; }
.line-item .meta { font-size: var(--step--1); color: var(--muted); margin-bottom: 0.7rem; }
.line-item .li-actions { display: flex; align-items: center; gap: 0.9rem; flex-wrap: wrap; }
.line-item .remove { border: 0; background: none; padding: 0; font: inherit; font-size: var(--step--1); color: var(--muted); text-decoration: underline; cursor: pointer; }
.line-item .remove:hover { color: var(--error); }
.line-item .li-price { text-align: right; font-variant-numeric: tabular-nums; }

.summary {
  position: sticky;
  top: 100px;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
}
.summary h2 { font-size: var(--step-1); }
.summary-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.45rem 0; font-size: var(--step-0); }
.summary-row span:last-child { font-variant-numeric: tabular-nums; }
.summary-row--total { border-top: 1px solid var(--line); margin-top: 0.6rem; padding-top: 0.9rem; font-size: var(--step-1); font-family: var(--font-display); }
.promo-form { display: flex; gap: 0.5rem; margin: 1rem 0; }
.promo-form input { flex: 1; }

.steps { display: flex; gap: 0.5rem; align-items: center; font-size: var(--step--1); color: var(--muted); margin-bottom: 2rem; letter-spacing: 0.1em; text-transform: uppercase; }
.steps span[aria-current="step"] { color: var(--ink); }
.steps .sep { color: var(--line); }

fieldset { border: 0; padding: 0; margin: 0 0 2rem; }
legend { font-family: var(--font-display); font-size: var(--step-1); margin-bottom: 1rem; padding: 0; }

.radio-card {
  display: flex;
  gap: 0.85rem;
  align-items: flex-start;
  padding: 1rem 1.1rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--white);
  cursor: pointer;
  margin-bottom: 0.6rem;
  transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
}
.radio-card:hover { border-color: var(--clay); }
.radio-card:has(input:checked) { border-color: var(--ink); background: var(--cream-2); }
.radio-card input { width: auto; margin-top: 0.35rem; flex: 0 0 auto; }
.radio-card .rc-body { flex: 1; }
.radio-card strong { display: block; font-weight: 500; }
.radio-card small { color: var(--muted); }
.radio-card .rc-price { font-variant-numeric: tabular-nums; }

.payment-placeholder {
  border: 1px dashed var(--sand-2);
  border-radius: var(--radius);
  padding: 1.25rem;
  background: var(--cream-2);
  font-size: var(--step--1);
  color: var(--ink-soft);
}

.confirmation { max-width: 620px; margin-inline: auto; text-align: center; }

/* 11. STATIC PAGES ======================================================== */
.prose { max-width: 68ch; }
.prose h2 { margin-top: 2.5rem; }
.prose h3 { margin-top: 1.75rem; }
.prose ul, .prose ol { padding-left: 1.2rem; }
.prose li { margin-bottom: 0.4rem; }

.stat-row { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.stat { text-align: center; }
.stat strong { display: block; font-family: var(--font-display); font-size: var(--step-3); line-height: 1; }
.stat span { font-size: var(--step--1); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

.contact-layout { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: clamp(1.5rem, 1rem + 3vw, 3.5rem); align-items: start; }
.info-card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1.6rem; }
.info-card + .info-card { margin-top: var(--gap); }
.info-card h3 { font-size: 1.2rem; }
.social-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.6rem; font-size: var(--step-0); }

.faq-search { max-width: 420px; margin-bottom: 2rem; }
.faq-group { margin-bottom: 2.5rem; }
.faq-group h2 { font-size: var(--step-2); }
.faq-empty { display: none; color: var(--muted); }

/* 12. FOOTER ============================================================== */
.site-footer { background: var(--ink); color: rgba(243, 239, 230, 0.78); padding-block: clamp(3rem, 2rem + 3vw, 4.5rem) 2rem; }
.site-footer h2, .site-footer h3 { color: var(--cream); }
.footer-grid { display: grid; gap: var(--gap); grid-template-columns: 1.5fr repeat(4, minmax(128px, 1fr)); }
.footer-grid h3 { font-family: var(--font-body); font-size: var(--step--1); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 1rem; }
.footer-grid ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.55rem; font-size: var(--step-0); }
.footer-grid a:hover { color: var(--cream); text-decoration: underline; text-underline-offset: 3px; }
.footer-brand .brand { font-size: 1.5rem; color: var(--cream); margin: 0 0 0.75rem; }
.footer-bottom {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.75rem;
  margin-top: 3rem;
  padding-top: 1.5rem;
  border-top: 1px solid rgba(243, 239, 230, 0.16);
  font-size: var(--step--1);
}
.footer-bottom nav[aria-label="Legal"] { display: flex; gap: 1.25rem; }
.footer-bottom nav[aria-label="Legal"] a { text-decoration: underline; text-underline-offset: 3px; }
.pay-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.pay-row span { border: 1px solid rgba(243, 239, 230, 0.24); border-radius: 6px; padding: 0.2rem 0.55rem; font-size: 0.68rem; letter-spacing: 0.1em; }
.pay-row .pay-soon { opacity: 0.55; }

.footer-tagline { font-family: var(--font-display); font-style: italic; color: var(--sand); font-size: 1.05rem; margin-bottom: 0.5rem; }
.footer-etsy { color: var(--sand) !important; }

.footer-newsletter {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 1.5rem;
  margin-top: clamp(2.5rem, 1.5rem + 2vw, 3.5rem);
  padding-top: clamp(2rem, 1.2rem + 2vw, 3rem);
  border-top: 1px solid rgba(243, 239, 230, 0.16);
}
.footer-newsletter > div:first-child { max-width: 32ch; }
.footer-newsletter form { display: flex; gap: 0.6rem; flex-wrap: wrap; min-width: 300px; }
.footer-newsletter input { flex: 1 1 220px; background: rgba(243, 239, 230, 0.08); border-color: rgba(243, 239, 230, 0.24); color: var(--cream); }
.footer-newsletter input::placeholder { color: rgba(243, 239, 230, 0.5); }
.footer-newsletter .form-status { color: var(--sand); background: rgba(243, 239, 230, 0.08); }

/* generic dismiss/remove link used inside drawers + line items */
.remove { border: 0; background: none; padding: 0; font: inherit; font-size: var(--step--1); color: var(--muted); text-decoration: underline; cursor: pointer; }
.remove:hover { color: var(--error); }

/* Mini-cart confirmation banner — "Added to your chapter 🤍" */
.drawer-confirm {
  margin: 0;
  padding: 0.85rem 1.5rem;
  background: var(--cream-2);
  border-bottom: 1px solid var(--line);
  font-family: var(--font-display);
  font-size: 1.05rem;
  color: var(--ink);
  animation: fade-up 0.35s var(--ease);
}
.drawer-confirm[hidden] { display: none; }

/* Mobile nav utility row (Wishlist / FAQ / Contact) */
.mobile-nav-utility {
  display: flex;
  gap: 1.25rem;
  flex-wrap: wrap;
  margin-top: 1.5rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--line);
}
.mobile-nav-utility a,
.mobile-nav-utility button {
  font: inherit;
  font-size: var(--step--1);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  background: none;
  border: 0;
  padding: 0;
  color: inherit;
  cursor: pointer;
}

/* Search + Account move into the mobile menu below 900px, keeping the
   header to the 3 actions that matter most on a small screen */
@media (max-width: 900px) {
  .header-actions [data-open-search],
  .header-actions [data-open-account] { display: none; }
}

/* Search panel */
.search-form { display: flex; flex-direction: column; }
.search-form input { font-size: var(--step-1); padding-block: 1rem; margin-bottom: 1rem; }

/* Quick add (product card hover) */
.quick-add {
  position: absolute;
  left: 0.75rem; right: 0.75rem; bottom: 0.75rem;
  z-index: 2;
  padding: 0.7rem 1rem;
  border: 1px solid var(--ink);
  border-radius: var(--radius);
  background: rgba(243, 239, 230, 0.94);
  color: var(--ink);
  font-size: var(--step--1);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.25s var(--ease), transform 0.25s var(--ease), background 0.25s var(--ease), color 0.25s var(--ease);
}
.product-card:hover .quick-add,
.product-card:focus-within .quick-add { opacity: 1; transform: none; }
.quick-add:hover { background: var(--ink); color: var(--cream); }
@media (hover: none) {
  .quick-add { opacity: 1; transform: none; position: static; margin: 0.75rem; width: calc(100% - 1.5rem); }
}

.quick-add-panel {
  position: absolute;
  inset: auto 0.75rem 0.75rem;
  z-index: 3;
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.9rem;
  box-shadow: var(--shadow-md);
  animation: fade-up 0.2s var(--ease);
}
.quick-add-panel p { font-size: var(--step--1); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; }
.quick-add-sizes { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.quick-add-sizes button {
  min-width: 40px;
  padding: 0.4rem 0.6rem;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--white);
  font: inherit;
  font-size: var(--step--1);
  cursor: pointer;
}
.quick-add-sizes button:hover { border-color: var(--ink); background: var(--ink); color: var(--cream); }

/* Empty / coming-soon collection state */
.empty-collection {
  grid-column: 1 / -1;
  text-align: center;
  padding: 3.5rem 1.5rem;
  background: var(--cream-2);
  border: 1px dashed var(--sand-2);
  border-radius: var(--radius-lg);
}
.empty-collection p:not(.eyebrow) { max-width: 46ch; margin-inline: auto 1.5rem; color: var(--ink-soft); }

/* Product page statement + wishlist icon */
.pdp-statement {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 1.15rem;
  color: var(--sage);
  margin-bottom: 1.5rem;
}
.wish-btn-pdp { flex: 0 0 auto; border: 1px solid var(--line); background: var(--white); }
.wish-btn-pdp[aria-pressed="true"] { color: var(--clay); border-color: var(--clay); }
.wish-btn-pdp[aria-pressed="true"] svg { fill: currentColor; }

.radio-card--disabled { opacity: 0.55; cursor: not-allowed; }
.radio-card--disabled input { cursor: not-allowed; }

/* Journal */
.journal-card {
  display: block;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.journal-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.journal-card img { aspect-ratio: 4 / 3; object-fit: cover; }
.journal-card-body { padding: 1.25rem 1.4rem 1.5rem; }
.journal-card-body h3 { font-size: 1.25rem; margin-bottom: 0.5rem; }
.journal-card-body p { color: var(--muted); font-size: var(--step--1); margin-bottom: 0.9rem; }

/* Pull quote — used on the About page */
.pull-quote {
  font-family: var(--font-display);
  font-style: italic;
  font-size: var(--step-2);
  line-height: 1.35;
  color: var(--ink);
  border-left: 2px solid var(--clay);
  padding-left: clamp(1.25rem, 0.8rem + 1.5vw, 2.25rem);
  margin-block: clamp(2.5rem, 1.5rem + 2vw, 4rem);
}

/* Digital Studio (Etsy) section */
.digital-studio {
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--white);
  padding: clamp(1.75rem, 1.2rem + 2vw, 3rem);
  display: grid;
  gap: clamp(1rem, 0.6rem + 1vw, 1.75rem);
  grid-template-columns: 1fr auto;
  align-items: center;
}
.digital-studio h2 { margin-bottom: 0.4rem; }

/* Size guide "how to measure" */
.measure-guide { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.measure-step { padding: 1.25rem; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); }
.measure-step strong { display: block; font-family: var(--font-display); font-size: 1.3rem; color: var(--clay); margin-bottom: 0.4rem; }

/* Hero entrance — brief, restrained motion on first paint only */
@keyframes hero-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.hero-copy > * { animation: hero-rise 0.7s var(--ease) both; }
.hero-copy > *:nth-child(2) { animation-delay: 0.06s; }
.hero-copy > *:nth-child(3) { animation-delay: 0.12s; }
.hero-copy > *:nth-child(4) { animation-delay: 0.18s; }
.hero-copy > *:nth-child(5) { animation-delay: 0.24s; }
.hero-media { animation: hero-rise 0.9s var(--ease) 0.1s both; }

/* 13. ANIMATION + RESPONSIVE ============================================== */
@keyframes fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

.reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
.reveal.is-in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  .reveal { opacity: 1; transform: none; }
}

@media (max-width: 1040px) {
  .footer-grid { grid-template-columns: 1fr 1fr; }
  .pdp, .cart-layout, .checkout-layout, .contact-layout { grid-template-columns: 1fr; }
  .summary { position: static; }
  .digital-studio { grid-template-columns: 1fr; text-align: center; }
}

@media (max-width: 900px) {
  .nav { display: none; }
  .nav-toggle { display: grid; }
  .hero { grid-template-columns: 1fr; }
  .hero-copy { max-width: none; }
  .hero-media { order: -1; }
  .hero-media .float-card { left: auto; right: 0.75rem; bottom: -1rem; }
  .header-actions .btn { display: none; }
  .footer-newsletter { flex-direction: column; align-items: flex-start; }
}

@media (max-width: 560px) {
  /* keep the logo + action icons inside a narrow viewport */
  .header-inner { min-height: 64px; gap: 0.25rem; }
  .brand { font-size: 1rem; letter-spacing: 0.12em; gap: 0.45rem; }
  .brand-mark { width: 34px; height: 34px; }
  .brand small { font-size: 0.5rem; letter-spacing: 0.18em; }
  .icon-btn { width: 40px; height: 40px; }
  .announce { font-size: 0.68rem; letter-spacing: 0.08em; }

  .line-item { grid-template-columns: 88px 1fr; }
  .line-item .li-price { grid-column: 2; text-align: left; }
  .footer-grid { grid-template-columns: 1fr; }
  .section-head { flex-direction: column; align-items: flex-start; }
  .hero-cta .btn { flex: 1 1 100%; }
  .grid--3, .grid--4 { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .mobile-nav-utility { gap: 1rem 1.5rem; }
}

@media print {
  .site-header, .site-footer, .drawer, .overlay, .toast-stack, .announce { display: none !important; }
}

</style>

/* ---------- panel open/close -------------------------------------------- */
function openPanel(selector, triggerSelector) {
  const panel = document.querySelector(selector);
  if (!panel) return;
  /* only one drawer/panel at a time — e.g. opening Search from inside the
     mobile menu shouldn't leave both stacked open */
  $$(".drawer, .mobile-nav").forEach((p) => {
    if (p !== panel) { p.classList.remove("is-open"); p.setAttribute("aria-hidden", "true"); }
  });
  panel.classList.add("is-open");
  panel.setAttribute("aria-hidden", "false");
  document.querySelector("[data-overlay]").classList.add("is-open");
  document.body.classList.add("no-scroll");
  const trigger = document.querySelector(triggerSelector);
  if (trigger) trigger.setAttribute("aria-expanded", "true");
  const focusable = panel.querySelector("input, button, a");
  if (focusable) focusable.focus();
}

function closePanels() {
  $$(".drawer, .mobile-nav").forEach((p) => {
    p.classList.remove("is-open");
    p.setAttribute("aria-hidden", "true");
  });
  const overlay = document.querySelector("[data-overlay]");
  if (overlay) overlay.classList.remove("is-open");
  document.body.classList.remove("no-scroll");
  $$("[data-open-cart], [data-open-nav], [data-open-search], [data-open-account]").forEach((b) =>
    b.setAttribute("aria-expanded", "false")
  );
}

/* ---------- cart UI (drawer contents + counters) ------------------------ */
function initCartUI() {
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-open-cart]")) return openPanel("#cart-drawer", "[data-open-cart]");
    if (e.target.closest("[data-open-nav]")) return openPanel(".mobile-nav", "[data-open-nav]");
    if (e.target.closest("[data-open-search]")) return openPanel("#search-panel", "[data-open-search]");
    if (e.target.closest("[data-open-account]")) return openPanel("#account-panel", "[data-open-account]");
    if (e.target.closest("[data-close-cart], [data-close-nav], [data-close-search], [data-close-account], [data-overlay]"))
      return closePanels();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closePanels();
  });

  const searchForm = document.querySelector("[data-site-search-form]");
  if (searchForm) {
    searchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = new FormData(searchForm).get("q") || "";
      closePanels();
      const target = `shop.html${q ? `?q=${encodeURIComponent(q)}` : ""}`;
      if (target.split("?")[0] === (window.__ROUTE__ ? window.__ROUTE__.page : location.pathname.split("/").pop())) {
        document.dispatchEvent(new CustomEvent("site-search", { detail: { q } }));
      } else {
        location.href = target;
      }
    });
  }

  /* quantity + remove inside the drawer */
  document.addEventListener("click", (e) => {
    const step = e.target.closest("[data-drawer-step]");
    if (step) {
      const i = Number(step.dataset.index);
      const delta = Number(step.dataset.drawerStep);
      const item = Store.cart[i];
      if (item) Store.updateQty(i, item.qty + delta);
      return;
    }
    const rm = e.target.closest("[data-drawer-remove]");
    if (rm) {
      Store.removeFromCart(Number(rm.dataset.drawerRemove));
      toast("Removed from your bag.");
    }
  });

  document.addEventListener("cart:change", renderCartUI);
  renderCartUI();
}

function renderCartUI() {
  const count = Store.cartCount;

  $$("[data-cart-count]").forEach((el) => {
    el.textContent = count;
    el.dataset.empty = String(count === 0);
  });
  $$("[data-cart-subtotal]").forEach((el) => (el.textContent = money(Store.subtotal)));

  const lines = document.querySelector("[data-cart-lines]");
  if (!lines) return;

  if (!Store.cart.length) {
    lines.innerHTML = `
      <div class="empty-state">
        <p>Your bag is empty.</p>
        <a class="btn btn--ghost btn--sm" href="shop.html">Browse T-Shirts</a>
      </div>`;
    return;
  }

  lines.innerHTML = Store.cart
    .map((item, i) => {
      const p = getProduct(item.id);
      if (!p) return "";
      return `
        <div class="mini-item">
          <img src="${p.images[0]}" alt="${escapeHtml(p.name)}" width="78" height="98" loading="lazy">
          <div>
            <h3><a href="product.html?id=${p.id}">${escapeHtml(p.name)}</a></h3>
            <p class="meta">${escapeHtml(colorOf(item.color).label)} · Size ${escapeHtml(item.size)}</p>
            ${item.note ? `<p class="meta">“${escapeHtml(item.note)}”</p>` : ""}
            <div style="display:flex;align-items:center;gap:.6rem;margin-top:.5rem">
              <span class="qty">
                <button type="button" data-drawer-step="-1" data-index="${i}" aria-label="Decrease quantity">−</button>
                <input type="text" value="${item.qty}" readonly aria-label="Quantity">
                <button type="button" data-drawer-step="1" data-index="${i}" aria-label="Increase quantity">+</button>
              </span>
              <button class="remove" type="button" data-drawer-remove="${i}">Remove</button>
            </div>
          </div>
          <span class="price">${money(p.price * item.qty)}</span>
        </div>`;
    })
    .join("");
}

/* ---------- product card ------------------------------------------------- */
/* Used on the homepage, shop, collections and related-products rails. */
function productCard(p, { eager = false } = {}) {
  const cat = getCollection(p.categories[0]);
  const swatches = p.colors
    .map((c) => `<span class="swatch" style="background:${colorOf(c).hex}" title="${colorOf(c).label}"></span>`)
    .join("");

  return `
    <article class="product-card reveal">
      <div class="media">
        ${p.badge ? `<div class="card-badges"><span class="badge${p.badge === "New" ? " badge--sage" : p.badge === "Limited" ? " badge--clay" : ""}">${p.badge}</span></div>` : ""}
        <button class="wish-btn" type="button" data-wish="${p.id}" aria-pressed="false"
                aria-label="Add ${escapeHtml(p.name)} to wishlist">${ICONS.heart}</button>
        <a href="product.html?id=${p.id}" aria-label="View ${escapeHtml(p.name)}">
          <img src="${p.images[0]}" alt="${escapeHtml(p.name)} — printed cotton T-shirt"
               width="900" height="1100" ${eager ? '' : 'loading="lazy"'} decoding="async">
          ${p.images[1] ? `<img class="alt-img" src="${p.images[1]}" alt="" width="900" height="1100" loading="lazy" aria-hidden="true">` : ""}
        </a>
        <button class="quick-add" type="button" data-quick-add="${p.id}">Quick Add</button>
      </div>
      <div class="body">
        <p class="cat">${cat ? cat.name : "T-Shirt"}</p>
        <h3><a href="product.html?id=${p.id}">${escapeHtml(p.name)}</a></h3>
        <p class="price">${money(p.price)} ${p.compareAt ? `<span class="muted" style="text-decoration:line-through;font-size:.85em">${money(p.compareAt)}</span>` : ""}</p>
        <div class="swatches" aria-label="Available colours">${swatches}</div>
      </div>
    </article>`;
}

/* Render a list of products into a container */
function renderProducts(container, list, opts = {}) {
  if (!container) return;
  if (!list.length) {
    container.innerHTML = `
      <div class="empty-collection">
        <p class="eyebrow">New Chapter, Coming Soon</p>
        <p>${opts.emptyMessage || "We're still designing this collection. Explore what's already printing while you wait."}</p>
        <a class="btn btn--ghost btn--sm" href="shop.html">Shop All T-Shirts</a>
      </div>`;
    return;
  }
  container.innerHTML = list.map((p, i) => productCard(p, { eager: i < 4 && opts.eagerFirst })).join("");
  initReveal();
  syncWishUI();
}

   ChapterByEmm — page controllers
   Each page sets <body data-page="…"> and the matching function runs.
   ========================================================================== */

function initPage() {
  const page = document.body.dataset.page;
  const routes = {
    home: initHome,
    shop: initShop,
    product: initProduct,
    collections: initCollections,
    cart: initCartPage,
    checkout: initCheckout,
    wishlist: initWishlistPage,
    faq: initFaq,
    custom: initCustomPage,
    "size-guide": initSizeGuide,
    journal: initJournal,
    "journal-post": initJournalPost,
  };
  if (routes[page]) routes[page]();
  renderReviewRails();
}

/* Shared: any container with data-reviews gets the review cards */
function renderReviewRails() {
  $$("[data-reviews]").forEach((el) => {
    const limit = Number(el.dataset.reviews) || REVIEWS.length;
    el.innerHTML = REVIEWS.slice(0, limit)
      .map(
        (r) => `
        <figure class="review reveal">
          <div class="stars" aria-label="${r.stars} out of 5 stars">${starsMarkup(r.stars)}</div>
          <blockquote>“${escapeHtml(r.text)}”</blockquote>
          <figcaption><cite>${escapeHtml(r.name)}</cite><br><span class="muted" style="font-size:var(--step--1)">${escapeHtml(r.detail)}</span></figcaption>
        </figure>`
      )
      .join("");
  });
}

/* ==========================================================================
   HOME
   ========================================================================== */
function initHome() {
  /* Featured = highest rated first. Swap for a hand-picked list if you prefer:
     const featured = ["stress-never-heard-of-her-tee"].map(getProduct); */
  const featured = PRODUCTS.slice()
    .sort((a, b) => b.rating - a.rating || b.reviewCount - a.reviewCount)
    .slice(0, 4);
  renderProducts($("[data-featured]"), featured, { eagerFirst: true });
  renderProducts($("[data-new-arrivals]"), byCollection("new-chapters").slice(0, 4));

  const colWrap = $("[data-collections-home]");

/* ==========================================================================
   SHOP  — filters, sorting, search
   ========================================================================== */
function initShop() {
  const grid = $("[data-shop-grid]");
  if (!grid) return;

  const state = {
    collection: param("collection") || "all",
    size: "all",
    color: "all",
    sort: param("sort") || "featured",
    q: param("q") || "",
  };

  /* build the filter chips from COLLECTIONS */
  const chipWrap = $("[data-collection-chips]");
  if (chipWrap) {
    chipWrap.innerHTML =
      `<button class="chip" type="button" data-filter-collection="all">All T-Shirts</button>` +
      COLLECTIONS.map(
        (c) => `<button class="chip" type="button" data-filter-collection="${c.id}">${c.name}</button>`
      ).join("");
  }

  const sizeWrap = $("[data-size-chips]");
  if (sizeWrap) {
    sizeWrap.innerHTML =
      `<button class="chip" type="button" data-filter-size="all">Any size</button>` +
      SIZES_ALL.map((s) => `<button class="chip" type="button" data-filter-size="${s}">${s}</button>`).join("");
  }

  const colorWrap = $("[data-color-chips]");
  if (colorWrap) {
    colorWrap.innerHTML =
      `<button class="chip" type="button" data-filter-color="all">Any colour</button>` +
      Object.keys(COLORS)
        .map(
          (k) =>
            `<button class="chip" type="button" data-filter-color="${k}"><span class="swatch" style="background:${COLORS[k].hex};vertical-align:-3px;margin-right:.4rem"></span>${COLORS[k].label}</button>`
        )
        .join("");
  }

  const searchInput = $("[data-shop-search]");
  if (searchInput) searchInput.value = state.q;
  const sortSelInit = $("[data-sort]");
  if (sortSelInit) sortSelInit.value = state.sort;

  function apply() {
    let list = PRODUCTS.slice();

    if (state.collection !== "all") list = list.filter((p) => p.categories.includes(state.collection));
    if (state.size !== "all") list = list.filter((p) => p.sizes.includes(state.size) && !(p.soldOut || []).includes(state.size));
    if (state.color !== "all") list = list.filter((p) => p.colors.includes(state.color));
    if (state.q) {
      const q = state.q.toLowerCase();
      list = list.filter((p) => (p.name + " " + p.description).toLowerCase().includes(q));
    }

    const sorters = {
      "price-asc": (a, b) => a.price - b.price,
      "price-desc": (a, b) => b.price - a.price,
      "name-asc": (a, b) => a.name.localeCompare(b.name),
      rating: (a, b) => b.rating - a.rating || b.reviewCount - a.reviewCount,
      newest: (a, b) => Number(b.categories.includes("new-chapters")) - Number(a.categories.includes("new-chapters")),
    };
    if (sorters[state.sort]) list.sort(sorters[state.sort]);

    const col = getCollection(state.collection);
    renderProducts(grid, list, {
      eagerFirst: true,
      emptyMessage: state.q
        ? `Nothing matched “${state.q}” — try a different word, or explore the full shop.`
        : col
        ? `New pieces for the ${col.name} collection are on the way. ${col.blurb}`
        : undefined,
    });

    /* reflect state in the UI */
    $$("[data-filter-collection]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.filterCollection === state.collection))
    );
    $$("[data-filter-size]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.filterSize === state.size)));
    $$("[data-filter-color]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.filterColor === state.color)));

    const count = $("[data-result-count]");
    if (count) count.textContent = `${list.length} ${list.length === 1 ? "T-Shirt" : "T-Shirts"}`;

    const title = $("[data-shop-title]");
    const blurb = $("[data-shop-blurb]");
    if (title) title.textContent = col ? col.name : "All T-Shirts";
    if (blurb) blurb.textContent = col ? col.blurb : "Every ChapterByEmm design — printed to order and shipped across Pakistan.";

    /* keep the URL shareable */
    const url = new URL(location.href);
    if (state.collection === "all") url.searchParams.delete("collection");
    else url.searchParams.set("collection", state.collection);
    if (state.q) url.searchParams.set("q", state.q);
    else url.searchParams.delete("q");
    history.replaceState(null, "", url);
  }

  const root = grid.closest("main") || document;
  root.addEventListener("click", (e) => {
    const c = e.target.closest("[data-filter-collection]");
    if (c) {
      state.collection = c.dataset.filterCollection;
      apply();
      return;
    }
    const s = e.target.closest("[data-filter-size]");
    if (s) {
      state.size = s.dataset.filterSize;
      apply();
      return;
    }
    const col = e.target.closest("[data-filter-color]");
    if (col) {
      state.color = col.dataset.filterColor;
      apply();
      return;
    }
    if (e.target.closest("[data-clear-filters]")) {
      state.collection = state.size = state.color = "all";
      state.q = "";
      if (searchInput) searchInput.value = "";
      apply();
    }
  });

  const sortSel = $("[data-sort]");
  if (sortSel) sortSel.addEventListener("change", () => ((state.sort = sortSel.value), apply()));

  if (searchInput) searchInput.addEventListener("input", () => ((state.q = searchInput.value.trim()), apply()));

  /* the header search panel can submit into an already-open shop page */
  document.addEventListener("site-search", (e) => {
    state.q = e.detail.q || "";
    if (searchInput) searchInput.value = state.q;
    apply();
  });

  apply();
}

/* ==========================================================================
   CART PAGE
   ========================================================================== */
function initCartPage() {
  const wrap = $("[data-cart-page]");
  if (!wrap) return;

  function render() {
    if (!wrap.isConnected) return;
    const items = Store.cart;

    if (!items.length) {
      wrap.innerHTML = `
        <div class="empty-state" style="padding:4rem 1rem">
          <h2>Your bag is empty</h2>
          <p>Every order is a physical T-shirt, printed just for you.</p>
          <a class="btn" href="shop.html">Shop T-Shirts</a>
        </div>`;
      const sum = $("[data-cart-summary]");
      if (sum) sum.style.display = "none";
      return;
    }

    wrap.innerHTML = items
      .map((item, i) => {
        const p = getProduct(item.id);
        if (!p) return "";
        return `
          <div class="line-item">
            <a href="product.html?id=${p.id}"><img src="${p.images[0]}" alt="${escapeHtml(p.name)}" width="120" height="150" loading="lazy"></a>
            <div>
              <h3><a href="product.html?id=${p.id}">${escapeHtml(p.name)}</a></h3>
              <p class="meta">${escapeHtml(colorOf(item.color).label)} · Size ${escapeHtml(item.size)}</p>
              <div class="li-actions">
                <span class="qty">
                  <button type="button" data-step="-1" data-index="${i}" aria-label="Decrease quantity">−</button>
                  <input type="text" value="${item.qty}" readonly aria-label="Quantity for ${escapeHtml(p.name)}">
                  <button type="button" data-step="1" data-index="${i}" aria-label="Increase quantity">+</button>
                </span>
                <button class="remove" type="button" data-remove="${i}">Remove</button>
                <button class="remove" type="button" data-wish="${p.id}" aria-pressed="false">Save for later</button>
              </div>
            </div>
            <div class="li-price">
              <strong>${money(p.price * item.qty)}</strong>
              <p class="meta">${money(p.price)} each</p>
            </div>
          </div>`;
      })
      .join("");

    renderSummary("[data-cart-summary]");
    syncWishUI();
  }

  wrap.addEventListener("click", (e) => {
    const step = e.target.closest("[data-step]");
    if (step) {
      const i = Number(step.dataset.index);
      Store.updateQty(i, Store.cart[i].qty + Number(step.dataset.step));
      return;
    }
    const rm = e.target.closest("[data-remove]");
    if (rm) {
      Store.removeFromCart(Number(rm.dataset.remove));
      toast("Removed from your bag.");
    }
  });

  document.addEventListener("cart:change", render);
  initPromoForm();
  render();

  const trust = $("[data-cart-trust]");
  if (trust) {
    trust.innerHTML = `
      <li>Printed &amp; dispatched in 2–4 business days</li>
      <li>Free standard delivery over ${money(SITE.freeShippingThreshold)}</li>
      <li>Cash on Delivery available nationwide</li>`;
  }
}

/* Order summary block, shared by cart + checkout */
function renderSummary(selector, shippingId = "standard") {
  const box = document.querySelector(selector);
  if (!box) return;
  const t = calcTotals(shippingId);
  box.style.display = "";

  const rows = $("[data-summary-rows]", box);
  if (!rows) return;
  rows.innerHTML = `
    <div class="summary-row"><span>Subtotal (${Store.cartCount} ${Store.cartCount === 1 ? "item" : "items"})</span><span>${money(t.subtotal)}</span></div>
    ${t.discount ? `<div class="summary-row" style="color:var(--success)"><span>Discount (${escapeHtml(t.promo)})</span><span>−${money(t.discount)}</span></div>` : ""}
    <div class="summary-row"><span>${t.method.label}</span><span>${t.shipping === 0 ? "Free" : money(t.shipping)}</span></div>
    ${t.tax > 0 ? `<div class="summary-row"><span>Estimated tax</span><span>${money(t.tax)}</span></div>` : ""}
    <div class="summary-row summary-row--total"><span>Total</span><span>${money(t.total)}</span></div>`;

  const progress = $("[data-ship-progress]", box);
  if (progress) {
    const left = SITE.freeShippingThreshold - t.subtotal;
    progress.textContent =
      left > 0
        ? `You are ${money(left)} away from free standard delivery.`
        : "Nice — standard delivery is free on this order.";
  }
}

/* Promo code form (cart + checkout) */
function initPromoForm() {
  const form = $("[data-promo-form]");
  if (!form) return;
  const status = $("[data-promo-status]", form.parentElement) || $("[data-promo-status]");

  const show = (msg, ok) => {
    if (!status) return toast(msg);
    status.textContent = msg;
    status.style.color = ok ? "var(--success)" : "var(--error)";
    status.style.display = "block";
  };

  if (Store.promo && PROMO_CODES[Store.promo]) {
    show(`${Store.promo} applied — ${PROMO_CODES[Store.promo].label}.`, true);
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("input", form);
    const code = input.value.trim().toUpperCase();
    if (!code) return;
    if (PROMO_CODES[code]) {
      Store.promo = code;
      show(`${code} applied — ${PROMO_CODES[code].label}.`, true);
      input.value = "";
    } else {
      Store.promo = null;
      show(`“${code}” is not a valid code.`, false);
    }
  });
}

  }

  if (citySel) {
    citySel.innerHTML = `<option value="">Select city…</option>` + PAKISTAN_CITIES.map((c) => `<option>${c}</option>`).join("");
  }

  const currentShipping = () => (form.querySelector('input[name="shipping"]:checked') || { value: "standard" }).value;
  const currentPayment = () => (form.querySelector('input[name="payMethod"]:checked') || { value: "cod" }).value;

  /* items in the summary panel */
  function renderItems() {
    const list = $("[data-checkout-items]");
    if (!list) return;
    list.innerHTML = Store.cart
      .map((item) => {
        const p = getProduct(item.id);
        if (!p) return "";
        return `
          <div class="mini-item">
            <img src="${p.images[0]}" alt="${escapeHtml(p.name)}" width="78" height="98" loading="lazy">
            <div>
              <h3 style="font-size:1rem">${escapeHtml(p.name)}</h3>
              <p class="meta">${escapeHtml(colorOf(item.color).label)} · ${escapeHtml(item.size)} · Qty ${item.qty}</p>
            </div>
            <span class="price">${money(p.price * item.qty)}</span>
          </div>`;
      })
      .join("");
  }

  function refresh() {
    if (!form.isConnected) return;
    renderItems();
    renderSummary("[data-checkout-summary]", currentShipping());
  }

  form.addEventListener("change", (e) => {
    if (e.target.name === "shipping") refresh();
  });
  document.addEventListener("cart:change", refresh);
  initPromoForm();
  refresh();

  if (!Store.cart.length) {
    const notice = $("[data-empty-checkout]");
    if (notice) notice.style.display = "block";
  }

  /* place order — front-end only. See the payment note in the markup. */
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!Store.cart.length) return toast("Your bag is empty.");
    if (!form.checkValidity()) return form.reportValidity();

    const data = Object.fromEntries(new FormData(form).entries());
    const t = calcTotals(currentShipping());
    const orderNo = "CBE-" + Date.now().toString().slice(-6);
    const payMethod = PAYMENT_METHODS.find((m) => m.id === currentPayment()) || PAYMENT_METHODS[0];

    /* ---- CONNECT A PAKISTANI PAYMENT GATEWAY HERE ----------------------
       For Cash on Delivery / Bank Transfer, no gateway is needed — the
       order simply needs to reach you (email/WhatsApp/sheet/backend).
       For Online Payment, integrate JazzCash, Easypaisa, or a card
       processor here before showing the confirmation screen:
         const res = await fetch("/api/create-payment", {
           method: "POST",
           headers: { "Content-Type": "application/json" },
           body: JSON.stringify({ items: Store.cart, customer: data }),
         });
         const { redirectUrl } = await res.json();
         location.href = redirectUrl;
    --------------------------------------------------------------------- */
    console.log("[order]", { orderNo, customer: data, items: Store.cart, totals: t, payMethod: payMethod.id });

    const method = SHIPPING_METHODS.find((m) => m.id === currentShipping());
    const bankNote =
      payMethod.id === "bank"
        ? `<p class="lede" style="margin-top:1rem">[EDIT] Add your bank account title, number and branch here so customers know where to transfer. We'll also confirm these details on WhatsApp.</p>`
        : "";

    $("[data-checkout-shell]").innerHTML = `
      <div class="confirmation">
        <p class="eyebrow">Order Received</p>
        <h1 style="font-size:var(--step-3)">Thank you, ${escapeHtml(data.fullName ? data.fullName.split(" ")[0] : "friend")}.</h1>
        <p class="lede">Your order <strong>${orderNo}</strong> is confirmed. We'll reach out on WhatsApp or email with a receipt, then a tracking update as soon as your T-shirt ships.</p>
        ${bankNote}
        <div class="summary" style="text-align:left;margin-top:2rem">
          <h2>Order Summary</h2>
          <div class="summary-row"><span>Items</span><span>${Store.cartCount}</span></div>
          <div class="summary-row"><span>${method.label}</span><span>${t.shipping === 0 ? "Free" : money(t.shipping)}</span></div>
          <div class="summary-row"><span>Delivery estimate</span><span>${method.eta}</span></div>
          <div class="summary-row"><span>Payment method</span><span>${payMethod.label.split("(")[0].trim()}</span></div>
          <div class="summary-row summary-row--total"><span>Total</span><span>${money(t.total)}</span></div>
        </div>
        <p style="margin-top:1.5rem"><a class="btn" href="shop.html">Continue Shopping</a></p>
      </div>`;
    Store.clearCart();
    Store.promo = null;
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

/* ==========================================================================
   FAQ — rendered from FAQ_GROUPS in data.js, with live search
   ========================================================================== */
function initFaq() {
  const wrap = $("[data-faq]");
  if (!wrap) return;

  const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  wrap.innerHTML = FAQ_GROUPS.map(
    (g) => `
    <section class="faq-group reveal" id="${slug(g.title)}">
      <h2>${escapeHtml(g.title)}</h2>
      <div class="accordion">
        ${g.items
          .map(
            (it) => `
          <details data-faq-item>
            <summary>${escapeHtml(it.q)}</summary>
            <div class="panel"><p>${escapeHtml(it.a)}</p></div>
          </details>`
          )
          .join("")}
      </div>
    </section>`
  ).join("");

  /* live search across questions + answers */
  const search = $("[data-faq-search]");
  const empty = $(".faq-empty");
  if (search) {
    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      let hits = 0;
      $$("[data-faq-item]", wrap).forEach((d) => {
        const match = !q || d.textContent.toLowerCase().includes(q);
        d.style.display = match ? "" : "none";
        if (match) hits++;
        d.open = Boolean(q) && match;
      });
      $$(".faq-group", wrap).forEach((g) => {
        const visible = $$("[data-faq-item]", g).some((d) => d.style.display !== "none");
        g.style.display = visible ? "" : "none";
      });
      if (empty) empty.style.display = hits ? "none" : "block";
    });
  }

  /* FAQPage structured data */
  const script = document.createElement("script");
  script.type = "application/ld+json";
  script.textContent = JSON.stringify({
    "@context": "https://schema.org",
    "@type": "FAQPage",
    mainEntity: FAQ_GROUPS.flatMap((g) =>
      g.items.map((it) => ({
        "@type": "Question",
        name: it.q,
        acceptedAnswer: { "@type": "Answer", text: it.a },
      }))
    ),
  });
  document.head.appendChild(script);

  if (location.hash) {
    const target = document.getElementById(location.hash.slice(1));
    if (target) target.scrollIntoView({ behavior: "smooth" });
  }
}

   ChapterByEmm — app core
   Cart + wishlist state, formatting, toasts, scroll reveals, form handling.
   You should not need to edit this file to change products or prices —

/* ---------- small helpers ------------------------------------------------ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const money = (n) => SITE.currencySymbol + Math.round(Number(n)).toLocaleString("en-US");

const getProduct = (id) => PRODUCTS.find((p) => p.id === id);
const getCollection = (id) => COLLECTIONS.find((c) => c.id === id);
const colorOf = (key) => COLORS[key] || { label: key, hex: "#cccccc" };

const byCollection = (id) => PRODUCTS.filter((p) => p.categories.includes(id));

const escapeHtml = (str) =>
  String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const starsMarkup = (n) => "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n));

/* Query string helper — used by product.html?id=… and shop.html?collection=… */
const param = (key) =>
  window.__ROUTE__ ? window.__ROUTE__.query.get(key) : new URLSearchParams(location.search).get(key);

/* ---------- persistent store -------------------------------------------- */
/* Cart + wishlist live in localStorage so they survive a page refresh.
   When you connect a real backend, replace read()/write() with API calls. */
const Store = {
  CART_KEY: "cbe_cart_v1",
  WISH_KEY: "cbe_wishlist_v1",

  read(key, fallback) {
    try {
      return JSON.parse(localStorage.getItem(key)) ?? fallback;
    } catch (e) {
      return fallback;
    }
  },
  write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      /* storage unavailable (private mode) — cart stays in memory only */
    }
  },

  /* --- cart --- */
  get cart() {
    return this.read(this.CART_KEY, []);
  },
  set cart(items) {
    this.write(this.CART_KEY, items);
    document.dispatchEvent(new CustomEvent("cart:change"));
  },

  lineKey: (id, size, color, note = "") => [id, size, color, note].join("|"),

  addToCart({ id, size, color, qty = 1, note = "" }) {
    const items = this.cart;
    const key = this.lineKey(id, size, color, note);
    const existing = items.find((i) => this.lineKey(i.id, i.size, i.color, i.note || "") === key);
    if (existing) existing.qty = Math.min(99, existing.qty + qty);
    else items.push({ id, size, color, qty, note });
    this.cart = items;
  },

  updateQty(index, qty) {
    const items = this.cart;
    if (!items[index]) return;
    if (qty <= 0) items.splice(index, 1);
    else items[index].qty = Math.min(99, qty);
    this.cart = items;
  },

  removeFromCart(index) {
    const items = this.cart;
    items.splice(index, 1);
    this.cart = items;
  },

  clearCart() {
    this.cart = [];
  },

  get cartCount() {
    return this.cart.reduce((n, i) => n + i.qty, 0);
  },

  get subtotal() {
    return this.cart.reduce((sum, i) => {
      const p = getProduct(i.id);
      return sum + (p ? p.price * i.qty : 0);
    }, 0);
  },

  /* --- wishlist --- */
  get wishlist() {
    return this.read(this.WISH_KEY, []);
  },
  set wishlist(ids) {
    this.write(this.WISH_KEY, ids);
    document.dispatchEvent(new CustomEvent("wishlist:change"));
  },
  isWished(id) {
    return this.wishlist.includes(id);
  },
  toggleWish(id) {
    const list = this.wishlist;
    const i = list.indexOf(id);
    if (i > -1) list.splice(i, 1);
    else list.push(id);
    this.wishlist = list;
    return this.isWished(id);
  },

  /* --- promo code --- */
  PROMO_KEY: "cbe_promo_v1",
  get promo() {
    return this.read(this.PROMO_KEY, null);
  },
  set promo(code) {
    this.write(this.PROMO_KEY, code);
    document.dispatchEvent(new CustomEvent("cart:change"));
  },
};

/* ---------- order totals ------------------------------------------------- */
/* Single source of truth for money maths, shared by the cart and checkout. */
function calcTotals(shippingId = "standard") {
  const subtotal = Store.subtotal;
  const method = SHIPPING_METHODS.find((m) => m.id === shippingId) || SHIPPING_METHODS[0];

  let shipping = method.price;
  if (method.id === "standard" && subtotal >= SITE.freeShippingThreshold) shipping = 0;

  let discount = 0;
  const promo = Store.promo;
  const rule = promo ? PROMO_CODES[promo] : null;
  if (rule) {
    if (rule.type === "percent") discount = subtotal * (rule.value / 100);
    else if (rule.type === "fixed") discount = Math.min(subtotal, rule.value);
    else if (rule.type === "shipping") shipping = 0;
  }

  const taxable = Math.max(0, subtotal - discount);
  const tax = taxable * SITE.taxRate;
  const total = taxable + tax + shipping;

  return { subtotal, discount, shipping, tax, total, method, promo, promoRule: rule };
}

/* ---------- toasts ------------------------------------------------------- */
function toast(message, actionLabel, actionHref) {
  let stack = $(".toast-stack");
  if (!stack) {
    stack = document.createElement("div");
    stack.className = "toast-stack";
    stack.setAttribute("role", "status");
    stack.setAttribute("aria-live", "polite");
    document.body.appendChild(stack);
  }
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML =
    escapeHtml(message) +
    (actionLabel ? ` <a href="${actionHref}" style="color:var(--rose)">${escapeHtml(actionLabel)}</a>` : "");
  stack.appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .4s, transform .4s";
    el.style.opacity = "0";
    el.style.transform = "translateY(8px)";
    setTimeout(() => el.remove(), 400);
  }, 3200);
}

/* ---------- scroll reveal ----------------------------------------------- */
function initReveal() {
  const targets = $$(".reveal");
  if (!targets.length) return;
  if (!("IntersectionObserver" in window)) {
    targets.forEach((t) => t.classList.add("is-in"));
    return;
  }
  const io = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry, i) => {
        if (!entry.isIntersecting) return;
        setTimeout(() => entry.target.classList.add("is-in"), i * 70);
        io.unobserve(entry.target);
      });
    },
    { rootMargin: "0px 0px -8% 0px", threshold: 0.08 }
  );
  targets.forEach((t) => io.observe(t));
}
