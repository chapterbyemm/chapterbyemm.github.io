/* ==========================================================================
   ChapterByEmm — global stylesheet
   --------------------------------------------------------------------------
   1. Design tokens (edit colours / fonts / spacing here)
   2. Base + typography
   3. Layout helpers
   4. Buttons, forms, badges
   5. Header, nav, cart drawer
   6. Hero + homepage sections
   7. Product cards + grids
   8. Shop filters
   9. Product detail page
   10. Cart + checkout
   11. Static pages (about, FAQ, contact, custom)
   12. Footer
   13. Animations + responsive
   ========================================================================== */

/* 1. DESIGN TOKENS ======================================================== */
:root {
  /* Brand palette — change these to re-skin the whole site */
  --cream: #fbf8f4;
  --cream-2: #f4ede4;
  --sand: #e9ded0;
  --sand-2: #dccfbe;
  --clay: #c9a294;
  --rose: #d8bcb2;
  --sage: #a9b6a3;
  --ink: #1e1c1a;
  --ink-soft: #423d38;
  --muted: #7d746b;
  --line: #e2d9cd;
  --white: #ffffff;
  --success: #5c7a5e;
  --error: #a2564b;

  /* Type */
  --font-display: "Cormorant Garamond", "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  /* Scale */
  --step--1: clamp(0.78rem, 0.76rem + 0.1vw, 0.86rem);
  --step-0: clamp(0.95rem, 0.92rem + 0.15vw, 1.05rem);
  --step-1: clamp(1.15rem, 1.05rem + 0.4vw, 1.4rem);
  --step-2: clamp(1.5rem, 1.3rem + 1vw, 2.1rem);
  --step-3: clamp(2rem, 1.6rem + 2vw, 3rem);
  --step-4: clamp(2.6rem, 1.8rem + 4.5vw, 5.4rem);

  /* Space + shape */
  --gap: clamp(1rem, 0.6rem + 1.5vw, 1.75rem);
  --section-y: clamp(3.5rem, 2rem + 6vw, 7rem);
  --shell: 1280px;
  --radius: 14px;
  --radius-lg: 22px;
  --radius-pill: 999px;
  --shadow-sm: 0 1px 2px rgba(30, 28, 26, 0.05), 0 4px 14px rgba(30, 28, 26, 0.04);
  --shadow-md: 0 10px 40px rgba(30, 28, 26, 0.09);
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

/* 2. BASE ================================================================= */
*,
*::before,
*::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
  overflow-x: clip; /* `clip`, not `hidden`, so the sticky header still sticks */
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body.no-scroll { overflow: hidden; }

img, svg { max-width: 100%; height: auto; display: block; }

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 500;
  line-height: 1.12;
  letter-spacing: -0.01em;
  margin: 0 0 0.5em;
}

h1 { font-size: var(--step-4); }
h2 { font-size: var(--step-3); }
h3 { font-size: var(--step-1); }

p { margin: 0 0 1em; }
p:last-child { margin-bottom: 0; }

a { color: inherit; text-decoration: none; }

/* prose links get a soft underline… */
a:not([class]) {
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-thickness: 1px;
  text-decoration-color: var(--clay);
}

/* …but links that are part of a UI component stay clean */
.product-card a,
.collection-card a,
.mini-item a,
.line-item a,
.breadcrumbs a,
.footer-grid a,
.social-list a,
.thumbs a { text-decoration: none; }

.breadcrumbs a:hover,
.footer-grid a:hover,
.social-list a:hover { text-decoration: underline; text-underline-offset: 3px; }

:focus-visible {
  outline: 2px solid var(--clay);
  outline-offset: 3px;
  border-radius: 4px;
}

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.skip-link {
  position: fixed;
  top: 0.5rem; left: 0.5rem;
  z-index: 999;
  padding: 0.7rem 1.1rem;
  background: var(--ink);
  color: var(--cream);
  border-radius: var(--radius-pill);
  transform: translateY(-160%);
  transition: transform 0.25s var(--ease);
}
.skip-link:focus { transform: translateY(0); }

/* 3. LAYOUT =============================================================== */
.shell {
  width: 100%;
  max-width: var(--shell);
  margin-inline: auto;
  padding-inline: clamp(1.15rem, 0.6rem + 2.5vw, 3rem);
}

.section { padding-block: var(--section-y); }
.section--tint { background: var(--cream-2); }
.section--sand { background: var(--sand); }
.section--ink { background: var(--ink); color: var(--cream); }
.section--ink .eyebrow, .section--ink .lede { color: rgba(251, 248, 244, 0.72); }

.section-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: clamp(1.75rem, 1rem + 2vw, 3rem);
}
.section-head > div { max-width: 60ch; }
.section-head--center { flex-direction: column; align-items: center; text-align: center; }

.eyebrow {
  display: block;
  font-size: var(--step--1);
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.9rem;
}

.lede { font-size: var(--step-1); color: var(--ink-soft); line-height: 1.55; }
.muted { color: var(--muted); }
.center { text-align: center; }

.grid { display: grid; gap: var(--gap); }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grid--3 { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid--4 { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }

.rule { height: 1px; background: var(--line); border: 0; margin: 0; }

/* 4. BUTTONS / FORMS ====================================================== */
.btn {
  --btn-bg: var(--ink);
  --btn-fg: var(--cream);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.55rem;
  padding: 0.95rem 1.9rem;
  min-height: 48px;
  border: 1px solid var(--btn-bg);
  border-radius: var(--radius-pill);
  background: var(--btn-bg);
  color: var(--btn-fg);
  font: inherit;
  font-size: var(--step--1);
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform 0.25s var(--ease), background 0.25s var(--ease),
    color 0.25s var(--ease), box-shadow 0.25s var(--ease);
}
.btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.btn:active { transform: translateY(0); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.btn--ghost { --btn-bg: transparent; --btn-fg: var(--ink); border-color: var(--ink); }
.btn--ghost:hover { background: var(--ink); color: var(--cream); }
.btn--light { --btn-bg: var(--cream); --btn-fg: var(--ink); }
.btn--clay { --btn-bg: var(--clay); --btn-fg: var(--white); }
.btn--sm { padding: 0.6rem 1.15rem; min-height: 40px; font-size: 0.72rem; }
.btn--block { width: 100%; }

.link-arrow {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: var(--step--1);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  border-bottom: 1px solid currentColor;
  padding-bottom: 0.3rem;
  transition: gap 0.25s var(--ease);
}
.link-arrow:hover { gap: 0.95rem; }

label { display: block; font-size: var(--step--1); letter-spacing: 0.06em; margin-bottom: 0.4rem; color: var(--ink-soft); }

input, select, textarea {
  width: 100%;
  padding: 0.85rem 1rem;
  font: inherit;
  font-size: var(--step-0);
  color: var(--ink);
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 10px;
  transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
}
input:focus, select:focus, textarea:focus {
  border-color: var(--clay);
  box-shadow: 0 0 0 3px rgba(201, 162, 148, 0.18);
  outline: none;
}
textarea { min-height: 140px; resize: vertical; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 20px) calc(50% + 2px), calc(100% - 15px) calc(50% + 2px); background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

.field { margin-bottom: 1.1rem; }
.field-row { display: grid; gap: 1.1rem; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.hint { font-size: var(--step--1); color: var(--muted); margin-top: 0.4rem; }
.form-note { font-size: var(--step--1); color: var(--muted); }

.form-status {
  display: none;
  margin-top: 1rem;
  padding: 0.9rem 1.1rem;
  border-radius: 10px;
  background: rgba(92, 122, 94, 0.12);
  color: var(--success);
  font-size: var(--step--1);
}
.form-status.is-visible { display: block; animation: fade-up 0.4s var(--ease); }

.badge {
  display: inline-block;
  padding: 0.3rem 0.7rem;
  border-radius: var(--radius-pill);
  background: var(--ink);
  color: var(--cream);
  font-size: 0.65rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.badge--clay { background: var(--clay); }
.badge--sage { background: var(--sage); color: var(--ink); }

/* 5. HEADER =============================================================== */
.announce {
  background: var(--ink);
  color: var(--cream);
  text-align: center;
  font-size: var(--step--1);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 0.6rem 1rem;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 60;
  background: rgba(251, 248, 244, 0.88);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.site-header.is-stuck { border-color: var(--line); box-shadow: 0 6px 24px rgba(30, 28, 26, 0.05); }

.header-inner {
  display: flex;
  align-items: center;
  gap: 1rem;
  min-height: 74px;
}

.brand {
  font-family: var(--font-display);
  font-size: 1.35rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  white-space: nowrap;
  margin-right: auto;
}
.brand small { display: block; font-family: var(--font-body); font-size: 0.55rem; letter-spacing: 0.3em; color: var(--muted); }

.nav { display: flex; align-items: center; gap: clamp(0.8rem, 0.2rem + 1vw, 1.9rem); }
.nav a {
  position: relative;
  font-size: var(--step--1);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding-block: 0.4rem;
}
.nav a::after {
  content: "";
  position: absolute;
  left: 0; bottom: 0;
  width: 100%; height: 1px;
  background: var(--ink);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s var(--ease);
}
.nav a:hover::after, .nav a[aria-current="page"]::after { transform: scaleX(1); }

.header-actions { display: flex; align-items: center; gap: 0.5rem; margin-left: auto; }

.icon-btn {
  position: relative;
  display: grid;
  place-items: center;
  width: 44px; height: 44px;
  border: 0;
  background: transparent;
  border-radius: 50%;
  cursor: pointer;
  color: var(--ink);
  transition: background 0.25s var(--ease);
}
.icon-btn:hover { background: var(--sand); }
.icon-btn svg { width: 20px; height: 20px; }

.count-bubble {
  position: absolute;
  top: 4px; right: 2px;
  min-width: 18px; height: 18px;
  padding: 0 4px;
  border-radius: var(--radius-pill);
  background: var(--clay);
  color: var(--white);
  font-size: 0.65rem;
  line-height: 18px;
  text-align: center;
}
.count-bubble[data-empty="true"] { display: none; }

.nav-toggle { display: none; }

/* Mobile nav panel */
.mobile-nav {
  position: fixed;
  inset: 0 0 0 auto;
  width: min(380px, 88vw);
  z-index: 80;
  background: var(--cream);
  padding: 1.5rem;
  transform: translateX(105%);
  transition: transform 0.4s var(--ease);
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  overflow-y: auto;
}
.mobile-nav.is-open { transform: translateX(0); box-shadow: var(--shadow-md); }
.mobile-nav a {
  font-family: var(--font-display);
  font-size: 1.5rem;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--line);
}
.mobile-nav .btn { margin-top: 1.25rem; }

/* Cart drawer */
.drawer {
  position: fixed;
  top: 0; right: 0;
  height: 100%;
  width: min(430px, 92vw);
  z-index: 80;
  background: var(--cream);
  display: flex;
  flex-direction: column;
  transform: translateX(105%);
  transition: transform 0.4s var(--ease);
}
.drawer.is-open { transform: translateX(0); box-shadow: var(--shadow-md); }
.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--line);
}
.drawer-head h2 { margin: 0; font-size: var(--step-1); }
.drawer-body { flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem; }
.drawer-foot { padding: 1.25rem 1.5rem; border-top: 1px solid var(--line); background: var(--cream-2); }

.overlay {
  position: fixed;
  inset: 0;
  z-index: 70;
  background: rgba(30, 28, 26, 0.42);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.35s var(--ease), visibility 0.35s;
}
.overlay.is-open { opacity: 1; visibility: visible; }

.mini-item {
  display: grid;
  grid-template-columns: 78px 1fr auto;
  gap: 0.9rem;
  padding-bottom: 1rem;
  margin-bottom: 1rem;
  border-bottom: 1px solid var(--line);
}
.mini-item:last-child { border-bottom: 0; }
.mini-item img { border-radius: 10px; background: var(--sand); }
.mini-item h3 { font-size: 1.05rem; margin-bottom: 0.15rem; }
.mini-item .meta { font-size: var(--step--1); color: var(--muted); }
.mini-item .price { font-variant-numeric: tabular-nums; }

.qty {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--white);
  overflow: hidden;
}
.qty button {
  width: 34px; height: 34px;
  border: 0;
  background: transparent;
  font-size: 1rem;
  cursor: pointer;
  color: var(--ink);
}
.qty button:hover { background: var(--sand); }
.qty input {
  width: 40px;
  border: 0;
  padding: 0;
  text-align: center;
  background: transparent;
  font-variant-numeric: tabular-nums;
}
.qty input:focus { box-shadow: none; }

.empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--muted); }

/* Toast */
.toast-stack {
  position: fixed;
  bottom: 1.25rem; left: 50%;
  transform: translateX(-50%);
  z-index: 120;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  width: min(420px, calc(100vw - 2rem));
}
.toast {
  background: var(--ink);
  color: var(--cream);
  padding: 0.85rem 1.1rem;
  border-radius: var(--radius);
  font-size: var(--step--1);
  box-shadow: var(--shadow-md);
  animation: fade-up 0.35s var(--ease);
}

/* 6. HERO + HOME ========================================================== */
.hero {
  position: relative;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  align-items: center;
  gap: clamp(1.5rem, 1rem + 3vw, 4rem);
  padding-block: clamp(3rem, 2rem + 5vw, 6.5rem);
}
.hero-copy { max-width: 34rem; }
.hero h1 {
  /* sized so the single long word CHAPTERBYEMM always fits its column */
  font-size: clamp(1.9rem, 0.3rem + 4vw, 4rem);
  letter-spacing: 0.01em;
  margin-bottom: 0.35em;
  overflow-wrap: break-word;
}
.hero .tagline {
  font-family: var(--font-display);
  font-size: var(--step-2);
  font-style: italic;
  color: var(--clay);
  margin-bottom: 0.7em;
}
.hero .intro { font-size: var(--step-1); color: var(--ink-soft); margin-bottom: 2rem; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 0.85rem; }
.hero-media { position: relative; }
.hero-media img {
  border-radius: var(--radius-lg);
  background: var(--sand);
  aspect-ratio: 4 / 5;
  object-fit: cover;
}
.hero-media .float-card {
  position: absolute;
  bottom: -1.25rem; left: -1.25rem;
  background: var(--cream);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 0.9rem 1.15rem;
  font-size: var(--step--1);
  max-width: 15rem;
}
.hero-media .float-card strong { display: block; font-family: var(--font-display); font-size: 1.1rem; }

.marquee {
  background: var(--ink);
  color: var(--cream);
  padding: 0.9rem 0;
  overflow: hidden;
}
.marquee-track {
  display: flex;
  gap: 3rem;
  width: max-content;
  animation: marquee 28s linear infinite;
  font-size: var(--step--1);
  letter-spacing: 0.24em;
  text-transform: uppercase;
}

.value-grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.value {
  padding: 1.5rem;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.value:hover { transform: translateY(-4px); box-shadow: var(--shadow-sm); }
.value h3 { font-size: 1.15rem; margin-bottom: 0.35rem; }
.value p { font-size: var(--step--1); color: var(--muted); }

/* Collections */
.collection-card {
  position: relative;
  display: block;
  overflow: hidden;
  border-radius: var(--radius-lg);
  background: var(--sand);
}
.collection-card img {
  aspect-ratio: 3 / 4;
  object-fit: cover;
  transition: transform 0.7s var(--ease);
}
.collection-card:hover img { transform: scale(1.06); }
.collection-card .overlay-text {
  position: absolute;
  inset: auto 0 0 0;
  padding: 1.5rem 1.25rem;
  background: linear-gradient(to top, rgba(30, 28, 26, 0.72), transparent);
  color: var(--cream);
}
.collection-card h3 { color: var(--cream); margin-bottom: 0.15rem; }
.collection-card p { font-size: var(--step--1); opacity: 0.85; }

/* Story */
.split {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: clamp(1.5rem, 1rem + 3vw, 4rem);
  align-items: center;
}
.split img { border-radius: var(--radius-lg); background: var(--sand); }
.signature { font-family: var(--font-display); font-style: italic; font-size: var(--step-1); color: var(--clay); }

/* Reviews */
.review {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.6rem;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}
.stars { color: var(--clay); letter-spacing: 0.18em; font-size: 0.95rem; }
.review blockquote { margin: 0; font-family: var(--font-display); font-size: var(--step-1); line-height: 1.45; }
.review cite { font-style: normal; font-size: var(--step--1); color: var(--muted); }

/* Instagram */
.ig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.6rem; }
.ig-grid a { position: relative; overflow: hidden; border-radius: var(--radius); }
.ig-grid img { aspect-ratio: 1; object-fit: cover; transition: transform 0.6s var(--ease), opacity 0.3s; }
.ig-grid a:hover img { transform: scale(1.08); opacity: 0.85; }

/* Newsletter */
.newsletter { text-align: center; }
.newsletter form {
  display: flex;
  gap: 0.6rem;
  max-width: 480px;
  margin: 1.5rem auto 0.75rem;
  flex-wrap: wrap;
}

/* ---------- panel open/close -------------------------------------------- */
function openPanel(selector, triggerSelector) {
  const panel = document.querySelector(selector);
  if (!panel) return;
  panel.classList.add("is-open");
  panel.setAttribute("aria-hidden", "false");
  document.querySelector("[data-overlay]").classList.add("is-open");
  document.body.classList.add("no-scroll");
  const trigger = document.querySelector(triggerSelector);
  if (trigger) trigger.setAttribute("aria-expanded", "true");
  const focusable = panel.querySelector("button, a, input");
  if (focusable) focusable.focus();
}

function closePanels() {
  $$(".drawer, .mobile-nav").forEach((p) => {
    p.classList.remove("is-open");
    p.setAttribute("aria-hidden", "true");
  });
  const overlay = document.querySelector("[data-overlay]");
  if (overlay) overlay.classList.remove("is-open");
  document.body.classList.remove("no-scroll");
  $$("[data-open-cart], [data-open-nav]").forEach((b) => b.setAttribute("aria-expanded", "false"));
}

/* ---------- cart UI (drawer contents + counters) ------------------------ */
function initCartUI() {
  document.addEventListener("click", (e) => {
    if (e.target.closest("[data-open-cart]")) return openPanel("#cart-drawer", "[data-open-cart]");
    if (e.target.closest("[data-open-nav]")) return openPanel(".mobile-nav", "[data-open-nav]");
    if (e.target.closest("[data-close-cart], [data-close-nav], [data-overlay]")) return closePanels();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closePanels();
  });

  /* quantity + remove inside the drawer */
  document.addEventListener("click", (e) => {
    const step = e.target.closest("[data-drawer-step]");
    if (step) {
      const i = Number(step.dataset.index);
      const delta = Number(step.dataset.drawerStep);
      const item = Store.cart[i];
      if (item) Store.updateQty(i, item.qty + delta);
      return;
    }
    const rm = e.target.closest("[data-drawer-remove]");
    if (rm) {
      Store.removeFromCart(Number(rm.dataset.drawerRemove));
      toast("Removed from your cart.");
    }
  });

  document.addEventListener("cart:change", renderCartUI);
  renderCartUI();
}

function renderCartUI() {
  const count = Store.cartCount;

  $$("[data-cart-count]").forEach((el) => {
    el.textContent = count;
    el.dataset.empty = String(count === 0);
  });
  $$("[data-cart-subtotal]").forEach((el) => (el.textContent = money(Store.subtotal)));

  const lines = document.querySelector("[data-cart-lines]");
  if (!lines) return;

  if (!Store.cart.length) {
    lines.innerHTML = `
      <div class="empty-state">
        <p>Your cart is empty.</p>
        <a class="btn btn--ghost btn--sm" href="shop.html">Browse T-shirts</a>
      </div>`;
    return;
  }

  lines.innerHTML = Store.cart
    .map((item, i) => {
      const p = getProduct(item.id);
      if (!p) return "";
      return `
        <div class="mini-item">
          <img src="${p.images[0]}" alt="${escapeHtml(p.name)}" width="78" height="98" loading="lazy">
          <div>
            <h3><a href="product.html?id=${p.id}">${escapeHtml(p.name)}</a></h3>
            <p class="meta">${escapeHtml(colorOf(item.color).label)} · Size ${escapeHtml(item.size)}</p>
            ${item.note ? `<p class="meta">“${escapeHtml(item.note)}”</p>` : ""}
            <div style="display:flex;align-items:center;gap:.6rem;margin-top:.5rem">
              <span class="qty">
                <button type="button" data-drawer-step="-1" data-index="${i}" aria-label="Decrease quantity">−</button>
                <input type="text" value="${item.qty}" readonly aria-label="Quantity">
                <button type="button" data-drawer-step="1" data-index="${i}" aria-label="Increase quantity">+</button>
              </span>
              <button class="remove" type="button" data-drawer-remove="${i}" style="border:0;background:none;text-decoration:underline;cursor:pointer;font:inherit;font-size:var(--step--1);color:var(--muted)">Remove</button>
            </div>
          </div>
          <span class="price">${money(p.price * item.qty)}</span>
        </div>`;
    })
    .join("");
}

/* Render a list of products into a container */
function renderProducts(container, list, opts = {}) {
  if (!container) return;
  if (!list.length) {
    container.innerHTML = `<p class="empty-state">No T-shirts match those filters yet — try clearing one.</p>`;
    return;
  }
  container.innerHTML = list.map((p, i) => productCard(p, { eager: i < 4 && opts.eagerFirst })).join("");
  initReveal();
  syncWishUI();
}

/* ==========================================================================
   SHOP  — filters, sorting, search
   ========================================================================== */
function initShop() {
  const grid = $("[data-shop-grid]");
  if (!grid) return;

  const state = {
    collection: param("collection") || "all",
    size: "all",
    color: "all",
    sort: "featured",
    q: "",
  };

  /* build the filter chips from COLLECTIONS */
  const chipWrap = $("[data-collection-chips]");
  if (chipWrap) {
    chipWrap.innerHTML =
      `<button class="chip" type="button" data-filter-collection="all">All T-shirts</button>` +
      COLLECTIONS.map(
        (c) => `<button class="chip" type="button" data-filter-collection="${c.id}">${c.name}</button>`
      ).join("");
  }

  const sizeWrap = $("[data-size-chips]");
  if (sizeWrap) {
    sizeWrap.innerHTML =
      `<button class="chip" type="button" data-filter-size="all">Any size</button>` +
      SIZES_ALL.map((s) => `<button class="chip" type="button" data-filter-size="${s}">${s}</button>`).join("");
  }

  const colorWrap = $("[data-color-chips]");
  if (colorWrap) {
    colorWrap.innerHTML =
      `<button class="chip" type="button" data-filter-color="all">Any colour</button>` +
      Object.keys(COLORS)
        .map(
          (k) =>
            `<button class="chip" type="button" data-filter-color="${k}"><span class="swatch" style="background:${COLORS[k].hex};vertical-align:-3px;margin-right:.4rem"></span>${COLORS[k].label}</button>`
        )
        .join("");
  }

  function apply() {
    let list = PRODUCTS.slice();

    if (state.collection !== "all") list = list.filter((p) => p.categories.includes(state.collection));
    if (state.size !== "all") list = list.filter((p) => p.sizes.includes(state.size) && !(p.soldOut || []).includes(state.size));
    if (state.color !== "all") list = list.filter((p) => p.colors.includes(state.color));
    if (state.q) {
      const q = state.q.toLowerCase();
      list = list.filter((p) => (p.name + " " + p.description).toLowerCase().includes(q));
    }

    const sorters = {
      "price-asc": (a, b) => a.price - b.price,
      "price-desc": (a, b) => b.price - a.price,
      "name-asc": (a, b) => a.name.localeCompare(b.name),
      rating: (a, b) => b.rating - a.rating,
      newest: (a, b) => Number(b.categories.includes("new-arrivals")) - Number(a.categories.includes("new-arrivals")),
    };
    if (sorters[state.sort]) list.sort(sorters[state.sort]);

    renderProducts(grid, list, { eagerFirst: true });

    /* reflect state in the UI */
    $$("[data-filter-collection]").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.filterCollection === state.collection))
    );
    $$("[data-filter-size]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.filterSize === state.size)));
    $$("[data-filter-color]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.filterColor === state.color)));

    const count = $("[data-result-count]");
    if (count) count.textContent = `${list.length} ${list.length === 1 ? "T-shirt" : "T-shirts"}`;

    const title = $("[data-shop-title]");
    const blurb = $("[data-shop-blurb]");
    const col = getCollection(state.collection);
    if (title) title.textContent = col ? col.name : "All T-shirts";
    if (blurb) blurb.textContent = col ? col.blurb : "Every ChapterByEmm design — printed to order on premium cotton blanks.";

    /* keep the URL shareable */
    const url = new URL(location.href);
    if (state.collection === "all") url.searchParams.delete("collection");
    else url.searchParams.set("collection", state.collection);
    history.replaceState(null, "", url);
  }

  const root = grid.closest("main") || document;
  root.addEventListener("click", (e) => {
    const c = e.target.closest("[data-filter-collection]");
    if (c) {
      state.collection = c.dataset.filterCollection;
      apply();
      return;
    }
    const s = e.target.closest("[data-filter-size]");
    if (s) {
      state.size = s.dataset.filterSize;
      apply();
      return;
    }
    const col = e.target.closest("[data-filter-color]");
    if (col) {
      state.color = col.dataset.filterColor;
      apply();
      return;
    }
    if (e.target.closest("[data-clear-filters]")) {
      state.collection = state.size = state.color = "all";
      state.q = "";
      const search = $("[data-shop-search]");
      if (search) search.value = "";
      apply();
    }
  });

  const sortSel = $("[data-sort]");
  if (sortSel) sortSel.addEventListener("change", () => ((state.sort = sortSel.value), apply()));

  const search = $("[data-shop-search]");
  if (search) search.addEventListener("input", () => ((state.q = search.value.trim()), apply()));

  apply();
}

  const qtyInput = $("[data-qty]", root);
  $$("[data-qty-step]", root).forEach((btn) =>
    btn.addEventListener("click", () => {
      selected.qty = Math.max(1, Math.min(99, selected.qty + Number(btn.dataset.qtyStep)));
      qtyInput.value = selected.qty;
    })
  );

  $("[data-open-size-chart]", root).addEventListener("click", () => {
    const details = $$("details", root)[1];
    details.open = true;
    details.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  /* --- add to cart --- */
  $("[data-add-to-cart]", root).addEventListener("click", () => {
    if (!selected.size) return toast("Please choose a size first.");
    const noteEl = $("[data-personal]", root);
    if (p.personalized && noteEl && !noteEl.value.trim()) {
      noteEl.focus();
      return toast("Add the text you would like printed.");
    }
    Store.addToCart({
      id: p.id,
      size: selected.size,
      color: selected.color,
      qty: selected.qty,
      note: noteEl ? noteEl.value.trim() : "",
    });
    toast(`${p.name} (${selected.size}) added to your cart.`, "View cart", "cart.html");
    openPanel("#cart-drawer", "[data-open-cart]");
  });

  /* --- related products --- */
  const related = PRODUCTS.filter((x) => x.id !== p.id && x.categories.some((c) => p.categories.includes(c))).slice(0, 4);
  renderProducts($("[data-related]"), related.length ? related : PRODUCTS.slice(0, 4));

  syncWishUI();

  /* --- structured data for search engines --- */
  const ld = {
    "@context": "https://schema.org",
    "@type": "Product",
    name: p.name,
    image: p.images,
    description: p.description,
    category: cat ? cat.name : "T-shirts",
    brand: { "@type": "Brand", name: SITE.name },
    material: "Cotton",
    offers: {
      "@type": "Offer",
      price: p.price.toFixed(2),
      priceCurrency: SITE.currency,
      availability: "https://schema.org/InStock",
      itemCondition: "https://schema.org/NewCondition",
    },
    aggregateRating: { "@type": "AggregateRating", ratingValue: p.rating, reviewCount: p.reviewCount },
  };
  const script = document.createElement("script");
  script.type = "application/ld+json";
  script.textContent = JSON.stringify(ld);
  document.head.appendChild(script);
}

        return `

              </div>

/* Order summary block, shared by cart + checkout */
function renderSummary(selector, shippingId = "standard") {
  const box = document.querySelector(selector);
  if (!box) return;
  const t = calcTotals(shippingId);
  box.style.display = "";

  const rows = $("[data-summary-rows]", box);
  if (!rows) return;
  rows.innerHTML = `
    <div class="summary-row"><span>Subtotal (${Store.cartCount} ${Store.cartCount === 1 ? "item" : "items"})</span><span>${money(t.subtotal)}</span></div>
    ${t.discount ? `<div class="summary-row" style="color:var(--success)"><span>Discount (${escapeHtml(t.promo)})</span><span>−${money(t.discount)}</span></div>` : ""}
    <div class="summary-row"><span>${t.method.label}</span><span>${t.shipping === 0 ? "Free" : money(t.shipping)}</span></div>
    <div class="summary-row"><span>Estimated tax</span><span>${money(t.tax)}</span></div>
    <div class="summary-row summary-row--total"><span>Total</span><span>${money(t.total)}</span></div>`;

  const progress = $("[data-ship-progress]", box);
  if (progress) {
    const left = SITE.freeShippingThreshold - t.subtotal;
    progress.textContent =
      left > 0
        ? `You are ${money(left)} away from free standard shipping.`
        : "Nice — standard shipping is free on this order.";
  }
}

/* Promo code form (cart + checkout) */
function initPromoForm() {
  const form = $("[data-promo-form]");
  if (!form) return;
  const status = $("[data-promo-status]", form.parentElement) || $("[data-promo-status]");

  const show = (msg, ok) => {
    if (!status) return toast(msg);
    status.textContent = msg;
    status.style.color = ok ? "var(--success)" : "var(--error)";
    status.style.display = "block";
  };

  if (Store.promo && PROMO_CODES[Store.promo]) {
    show(`${Store.promo} applied — ${PROMO_CODES[Store.promo].label}.`, true);
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("input", form);
    const code = input.value.trim().toUpperCase();
    if (!code) return;
    if (PROMO_CODES[code]) {
      Store.promo = code;
      show(`${code} applied — ${PROMO_CODES[code].label}.`, true);
      input.value = "";
    } else {
      Store.promo = null;
      show(`“${code}” is not a valid code.`, false);
    }
  });
}

       Example (Stripe):
         const res = await fetch("/api/create-checkout-session", {
           method: "POST",
           headers: { "Content-Type": "application/json" },
           body: JSON.stringify({ items: Store.cart, email: data.email }),
         });
         const { url } = await res.json();
         location.href = url;
    --------------------------------------------------------------------- */
    console.log("[order]", { orderNo, customer: data, items: Store.cart, totals: t });

    const method = SHIPPING_METHODS.find((m) => m.id === currentShipping());
    $("[data-checkout-shell]").innerHTML = `

        <p class="lede">Your order <strong>${orderNo}</strong> is confirmed. We’ll email a receipt to ${escapeHtml(data.email || "your inbox")}, then a tracking link as soon as your T-shirt ships.</p>

          <div class="summary-row"><span>Delivery estimate</span><span>${method.eta}</span></div>

   ChapterByEmm — app core
   Cart + wishlist state, formatting, toasts, scroll reveals, form handling.

/* ---------- small helpers ------------------------------------------------ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const money = (n) =>
  SITE.currencySymbol +
  Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const getProduct = (id) => PRODUCTS.find((p) => p.id === id);
const getCollection = (id) => COLLECTIONS.find((c) => c.id === id);
const colorOf = (key) => COLORS[key] || { label: key, hex: "#cccccc" };

const byCollection = (id) => PRODUCTS.filter((p) => p.categories.includes(id));

const escapeHtml = (str) =>
  String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const starsMarkup = (n) => "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n));

/* Query string helper — used by product.html?id=… and shop.html?collection=… */
const param = (key) =>
  window.__ROUTE__ ? window.__ROUTE__.query.get(key) : new URLSearchParams(location.search).get(key);

/* ---------- persistent store -------------------------------------------- */
/* Cart + wishlist live in localStorage so they survive a page refresh.
   When you connect a real backend, replace read()/write() with API calls. */
const Store = {
  CART_KEY: "cbe_cart_v1",
  WISH_KEY: "cbe_wishlist_v1",

  read(key, fallback) {
    try {
      return JSON.parse(localStorage.getItem(key)) ?? fallback;
    } catch (e) {
      return fallback;
    }
  },
  write(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      /* storage unavailable (private mode) — cart stays in memory only */
    }
  },

  /* --- cart --- */
  get cart() {
    return this.read(this.CART_KEY, []);
  },
  set cart(items) {
    this.write(this.CART_KEY, items);
    document.dispatchEvent(new CustomEvent("cart:change"));
  },

  lineKey: (id, size, color, note = "") => [id, size, color, note].join("|"),

  addToCart({ id, size, color, qty = 1, note = "" }) {
    const items = this.cart;
    const key = this.lineKey(id, size, color, note);
    const existing = items.find((i) => this.lineKey(i.id, i.size, i.color, i.note || "") === key);
    if (existing) existing.qty = Math.min(99, existing.qty + qty);
    else items.push({ id, size, color, qty, note });
    this.cart = items;
  },

  updateQty(index, qty) {
    const items = this.cart;
    if (!items[index]) return;
    if (qty <= 0) items.splice(index, 1);
    else items[index].qty = Math.min(99, qty);
    this.cart = items;
  },

  removeFromCart(index) {
    const items = this.cart;
    items.splice(index, 1);
    this.cart = items;
  },

  clearCart() {
    this.cart = [];
  },

  get cartCount() {
    return this.cart.reduce((n, i) => n + i.qty, 0);
  },

  get subtotal() {
    return this.cart.reduce((sum, i) => {
      const p = getProduct(i.id);
      return sum + (p ? p.price * i.qty : 0);
    }, 0);
  },

  /* --- wishlist --- */
  get wishlist() {
    return this.read(this.WISH_KEY, []);
  },
  set wishlist(ids) {
    this.write(this.WISH_KEY, ids);
    document.dispatchEvent(new CustomEvent("wishlist:change"));
  },
  isWished(id) {
    return this.wishlist.includes(id);
  },
  toggleWish(id) {
    const list = this.wishlist;
    const i = list.indexOf(id);
    if (i > -1) list.splice(i, 1);
    else list.push(id);
    this.wishlist = list;
    return this.isWished(id);
  },

  /* --- promo code --- */
  PROMO_KEY: "cbe_promo_v1",
  get promo() {
    return this.read(this.PROMO_KEY, null);
  },
  set promo(code) {
    this.write(this.PROMO_KEY, code);
    document.dispatchEvent(new CustomEvent("cart:change"));
  },
};

/* ---------- order totals ------------------------------------------------- */
/* Single source of truth for money maths, shared by the cart and checkout. */
function calcTotals(shippingId = "standard") {
  const subtotal = Store.subtotal;
  const method = SHIPPING_METHODS.find((m) => m.id === shippingId) || SHIPPING_METHODS[0];

  let shipping = method.price;
  if (method.id === "standard" && subtotal >= SITE.freeShippingThreshold) shipping = 0;

  let discount = 0;
  const promo = Store.promo;
  const rule = promo ? PROMO_CODES[promo] : null;
  if (rule) {
    if (rule.type === "percent") discount = subtotal * (rule.value / 100);
    else if (rule.type === "fixed") discount = Math.min(subtotal, rule.value);
    else if (rule.type === "shipping") shipping = 0;
  }

  const taxable = Math.max(0, subtotal - discount);
  const tax = taxable * SITE.taxRate;
  const total = taxable + tax + shipping;

  return { subtotal, discount, shipping, tax, total, method, promo, promoRule: rule };
}

/* ---------- toasts ------------------------------------------------------- */
function toast(message, actionLabel, actionHref) {
  let stack = $(".toast-stack");
  if (!stack) {
    stack = document.createElement("div");
    stack.className = "toast-stack";
    stack.setAttribute("role", "status");
    stack.setAttribute("aria-live", "polite");
    document.body.appendChild(stack);
  }
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML =
    escapeHtml(message) +
    (actionLabel ? ` <a href="${actionHref}" style="color:var(--rose)">${escapeHtml(actionLabel)}</a>` : "");
  stack.appendChild(el);
  setTimeout(() => {
    el.style.transition = "opacity .4s, transform .4s";
    el.style.opacity = "0";
    el.style.transform = "translateY(8px)";
    setTimeout(() => el.remove(), 400);
  }, 3200);
}

/* ---------- scroll reveal ----------------------------------------------- */
function initReveal() {
  const targets = $$(".reveal");
  if (!targets.length) return;
  if (!("IntersectionObserver" in window)) {
    targets.forEach((t) => t.classList.add("is-in"));
    return;
  }
  const io = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry, i) => {
        if (!entry.isIntersecting) return;
        setTimeout(() => entry.target.classList.add("is-in"), i * 70);
        io.unobserve(entry.target);
      });
    },
    { rootMargin: "0px 0px -8% 0px", threshold: 0.08 }
  );
  targets.forEach((t) => io.observe(t));
}

/* ---------- wishlist buttons (delegated) -------------------------------- */
/* Call syncWishUI() directly after re-rendering markup. Only real *state
   changes* should dispatch wishlist:change — dispatching it from inside a
   render function would re-trigger any render that listens for it. */
function syncWishUI() {
  $$("[data-wish]").forEach((b) => b.setAttribute("aria-pressed", String(Store.isWished(b.dataset.wish))));
  $$("[data-wish-count]").forEach((el) => {
    el.textContent = Store.wishlist.length;
    el.dataset.empty = String(Store.wishlist.length === 0);
  });
}

function initWishlistButtons() {
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-wish]");
    if (!btn) return;
    e.preventDefault();
    const id = btn.dataset.wish;
    const on = Store.toggleWish(id);
    const product = getProduct(id);
    toast(on ? `Saved ${product ? product.name : "item"} to your wishlist.` : "Removed from your wishlist.");
  });

  document.addEventListener("wishlist:change", syncWishUI);
}

bW08L3RleHQ+CiAgPHRleHQgeD0iNjAwLjAiIHk9IjUxNy4wIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0iSGVsdmV0aWNhLEFyaWFsLHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMjgiIGxldHRlci1zcGFjaW5nPSI0IiBmaWxsPSIjM0EzNDJDIiBvcGFjaXR5PSIuNiI+VEhFIEJSQU5EPC90ZXh0Pgo8L3N2Zz4=\" alt=\"Emm holding a freshly printed ChapterByEmm cotton T-shirt in the studio\" width=\"1200\" height=\"900\" style=\"border-radius:var(--radius-lg)\" decoding=\"async\">\n    </section>\n\n    <section class=\"section section--tint\">\n      <div class=\"shell split\">\n        <div class=\"prose\">\n          <span class=\"eyebrow\">How it started</span>\n          <h2>It began with one tee and one hard year</h2>\n          <p>I made the first ChapterByEmm shirt for myself. I was in the middle of a chapter I hadn't planned for, and I wanted to wear something that said it out loud without saying too much. So I set four words in a soft serif, printed them on a cream cotton tee, and wore it until the collar went soft.</p>\n          <p>Friends asked where it was from. Then their friends asked. That's genuinely how this started \u2014 one shirt at a time, printed on a small press, packed at my kitchen table.</p>\n          <h3>What we believe</h3>\n          <p>Clothes aren't just clothes. The tee you reach for on a hard morning does something small and real for you. That's why every design starts with a feeling rather than a trend, and why we keep the wording gentle enough to still feel true a year from now.</p>\n          <h3>How each tee is made</h3>\n          <p>We print to order in small batches, so nothing sits in a warehouse and nothing goes to landfill. Every blank is combed ring-spun or organic cotton that I've worn and washed myself before it goes into the shop. Prints are pressed with water-based inks that sink into the fabric rather than sitting on top, then each tee is checked, folded and packed in recyclable tissue by hand.</p>\n          <p class=\"signature\" style=\"margin-top:1.5rem\">\u2014 Emm, founder &amp; designer</p>\n        </div>\n        <img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAwIDEyMDAiIHdpZHRoPSIxMDAwIiBoZWlnaHQ9IjEyMDAiIHJvbGU9ImltZyI+CiAgPHJlY3Qgd2lkdGg9IjEwMDAiIGhlaWdodD0iMTIwMCIgZmlsbD0iI0U5RTFENSIvPgogIDxnIG9wYWNpdHk9Ii41Ij48Y2lyY2xlIGN4PSI3ODAuMCIgY3k9IjMwMC4wIiByPSIyMjAuMCIgZmlsbD0iI2ZmZiIgb3BhY2l0eT0iLjM1Ii8+CiAgPGNpcmNsZSBjeD0iMjAwLjAiIGN5PSI5NjAuMCIgcj0iMzAwLjAiIGZpbGw9IiMwMDAiIG9wYWNpdHk9Ii4wNSIvPjwvZz4KICA8dGV4dCB4PSI1MDAuMCIgeT0iNjAwLjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJHZW9yZ2lhLHNlcmlmIiBmb250LXNpemU9IjkwIiBmaWxsPSIjM0EzNDJDIj5NYWRlIGJ5IEVtbTwvdGV4dD4KICA8dGV4dCB4PSI1MDAuMCIgeT0iNjc1LjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJIZWx2ZXRpY2EsQXJpYWwsc2Fucy1zZXJpZiIgZm9udC1zaXplPSIzMiIgbGV0dGVyLXNwYWNpbmc9IjQiIGZpbGw9IiMzQTM0MkMiIG9wYWNpdHk9Ii42Ij5TVFVESU88L3RleHQ+Cjwvc3ZnPg==\" alt=\"Cotton T-shirt blanks and ink samples laid out on a work table\" width=\"1000\" height=\"1200\" loading=\"lazy\" style=\"border-radius:var(--radius-lg)\">\n      </div>\n    </section>\n\n    <section class=\"section shell\">\n      <div class=\"section-head section-head--center\">\n        <div>\n          <span class=\"eyebrow\">Our promises</span>\n          <h2>What you can count on</h2>\n        </div>\n      </div>\n      <div class=\"value-grid\">\n        <div class=\"value reveal\">\n          <h3>Real garments, made to last</h3>\n          <p>Every order is a physical printed T-shirt on 160\u2013230 gsm cotton \u2014 never a transfer that peels after three washes.</p>\n        </div>\n        <div class=\"value reveal\">\n          <h3>Made in small batches</h3>\n          <p>Printed to order in our own studio, which keeps waste low and quality high. Nothing mass-produced.</p>\n        </div>\n        <div class=\"value reveal\">\n          <h3>Honest sizing</h3>\n          <p>Real body measurements on every product page, and a human who'll answer your sizing email the same day.</p>\n        </div>\n        <div class=\"value reveal\">\n          <h3>Care after checkout</h3>\n          <p>Tracking on every parcel, 30-day exchanges, and a free reprint if anything arrives less than perfect.</p>\n        </div>\n      </div>\n    </section>\n\n    <section class=\"section section--sand\">\n      <div class=\"shell center\">\n        <span class=\"eyebrow\">Start yours</span>\n        <h2>Which chapter are you in?</h2>\n        <p class=\"lede\" style=\"max-width:48ch;margin-inline:auto\">Browse the collections, or tell us your words and we'll print them for you.</p>\n        <div class=\"hero-cta\" style=\"justify-content:center;margin-top:1.5rem\">\n          <a class=\"btn\" href=\"shop.html\">Shop Now</a>\n          <a class=\"btn btn--ghost\" href=\"custom-designs.html\">Request a custom tee</a>\n        </div>\n      </div>\n    </section>", "custom-designs.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">Custom Designs</span>\n      </nav>\n      <span class=\"eyebrow\">Personalized printed tees</span>\n      <h1>Custom Designs</h1>\n      <p class=\"lede\" style=\"max-width:60ch\">Your words, names, dates or your own idea \u2014 set by hand in one of our signature typefaces and printed on the same premium cotton blanks as the rest of the shop.</p>\n    </header>\n\n    <section class=\"shell\" style=\"padding-bottom:var(--section-y)\">\n      <div class=\"split\">\n        <div>\n          <img src=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMjAwIDkwMCIgd2lkdGg9IjEyMDAiIGhlaWdodD0iOTAwIiByb2xlPSJpbWciPgogIDxyZWN0IHdpZHRoPSIxMjAwIiBoZWlnaHQ9IjkwMCIgZmlsbD0iI0VERTREOCIvPgogIDxnIG9wYWNpdHk9Ii41Ij48Y2lyY2xlIGN4PSI5MzYuMCIgY3k9IjIyNS4wIiByPSIxOTguMCIgZmlsbD0iI2ZmZiIgb3BhY2l0eT0iLjM1Ii8+CiAgPGNpcmNsZSBjeD0iMjQwLjAiIGN5PSI3MjAuMCIgcj0iMjcwLjAiIGZpbGw9IiMwMDAiIG9wYWNpdHk9Ii4wNSIvPjwvZz4KICA8dGV4dCB4PSI2MDAuMCIgeT0iNDUwLjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJHZW9yZ2lhLHNlcmlmIiBmb250LXNpemU9IjgxIiBmaWxsPSIjM0EzNDJDIj5DdXN0b20gRGVzaWduczwvdGV4dD4KICA8dGV4dCB4PSI2MDAuMCIgeT0iNTE3LjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJIZWx2ZXRpY2EsQXJpYWwsc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyOCIgbGV0dGVyLXNwYWNpbmc9IjQiIGZpbGw9IiMzQTM0MkMiIG9wYWNpdHk9Ii42Ij5ZT1VSIFdPUkRTLCBPVVIgUFJJTlQ8L3RleHQ+Cjwvc3ZnPg==\" alt=\"A custom printed T-shirt with personalised lettering laid on linen\" width=\"1200\" height=\"900\" style=\"border-radius:var(--radius-lg)\" decoding=\"async\">\n        </div>\n        <div>\n          <span class=\"eyebrow\">How it works</span>\n          <h2>Four simple steps</h2>\n          <ol class=\"prose\" style=\"padding-left:1.2rem\">\n            <li><strong>Tell us your idea.</strong> Fill in the form below with your wording, style, size and colour.</li>\n            <li><strong>We reply with a proof.</strong> Within 1\u20132 business days you'll get a mock-up and a firm quote.</li>\n            <li><strong>You approve it.</strong> Nothing is printed until you're happy \u2014 small tweaks are free.</li>\n            <li><strong>We print and ship.</strong> Personalised tees are printed in 3\u20135 business days, then dispatched with tracking.</li>\n          </ol>\n          <p class=\"hint\">Personalised tees start at $42. Bulk pricing available from 6 shirts \u2014 family reunions, baby showers, small businesses and team gifts welcome.</p>\n        </div>\n      </div>\n    </section>\n\n    <section class=\"section section--tint\">\n      <div class=\"shell\" style=\"max-width:840px\">\n        <div class=\"section-head section-head--center\">\n          <div>\n            <span class=\"eyebrow\">Request form</span>\n            <h2>Tell us what to print</h2>\n            <p class=\"lede\">The more detail you give us, the closer the first proof will be.</p>\n          </div>\n        </div>\n\n        <form data-form=\"custom-design\" data-success=\"Thank you \u2014 your request is with Emm. You'll have a proof and a quote within 1\u20132 business days.\" novalidate\n              style=\"background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:clamp(1.25rem,1rem+2vw,2.25rem)\">\n\n          <fieldset>\n            <legend>Your details</legend>\n            <div class=\"field-row\">\n              <div class=\"field\">\n                <label for=\"name\">Full name</label>\n                <input id=\"name\" name=\"name\" type=\"text\" required autocomplete=\"name\">\n              </div>\n              <div class=\"field\">\n                <label for=\"email\">Email address</label>\n                <input id=\"email\" name=\"email\" type=\"email\" required autocomplete=\"email\">\n              </div>\n            </div>\n            <div class=\"field\">\n              <label for=\"instagram\">Instagram handle (optional)</label>\n              <input id=\"instagram\" name=\"instagram\" type=\"text\" placeholder=\"@yourhandle\">\n            </div>\n          </fieldset>\n\n          <fieldset>\n            <legend>Your design</legend>\n            <div class=\"field\">\n              <label for=\"idea\">Your idea</label>\n              <textarea id=\"idea\" name=\"idea\" required placeholder=\"Tell us what this tee is for \u2014 a birthday, a new baby, a milestone, an inside joke\u2026\"></textarea>\n            </div>\n            <div class=\"field\">\n              <label for=\"text\">Exact text to print</label>\n              <input id=\"text\" name=\"text\" type=\"text\" required maxlength=\"80\" placeholder=\"e.g. Mama of Three \u00b7 Est. 2019\">\n              <p class=\"hint\">Type it exactly as you'd like it printed, including capitals and punctuation.</p>\n            </div>\n            <div class=\"field-row\">\n              <div class=\"field\">\n                <label for=\"style\">Design style</label>\n                <select id=\"style\" name=\"style\" required>\n                  <option value=\"\">Choose a style\u2026</option>\n                  <option>Soft serif (our signature)</option>\n                  <option>Hand-lettered script</option>\n                  <option>Minimal lowercase sans</option>\n                  <option>Bold statement caps</option>\n                  <option>Small centre-chest print</option>\n                  <option>Not sure \u2014 suggest something</option>\n                </select>\n              </div>\n              <div class=\"field\">\n                <label for=\"placement\">Print placement</label>\n                <select id=\"placement\" name=\"placement\">\n                  <option>Centre chest</option>\n                  <option>Left chest (small)</option>\n                  <option>Full front</option>\n                  <option>Back print</option>\n                  <option>Front and back</option>\n                </select>\n              </div>\n            </div>\n          </fieldset>\n\n          <fieldset>\n            <legend>Shirt details</legend>\n            <div class=\"field-row\">\n              <div class=\"field\">\n                <label for=\"size\">Size</label>\n                <select id=\"size\" name=\"size\" required data-custom-sizes></select>\n              </div>\n              <div class=\"field\">\n                <label for=\"color\">Shirt colour</label>\n                <select id=\"color\" name=\"color\" required data-custom-colors></select>\n              </div>\n              <div class=\"field\">\n                <label for=\"qty\">Quantity</label>\n                <input id=\"qty\" name=\"qty\" type=\"number\" min=\"1\" max=\"200\" value=\"1\" required>\n              </div>\n            </div>\n            <div class=\"field\">\n              <label for=\"deadline\">Needed by (optional)</label>\n              <input id=\"deadline\" name=\"deadline\" type=\"date\">\n              <p class=\"hint\">Please allow at least 10 days for personalised orders, or ask us about a rush.</p>\n            </div>\n            <div class=\"field\">\n              <label for=\"requirements\">Anything else we should know?</label>\n              <textarea id=\"requirements\" name=\"requirements\" style=\"min-height:110px\" placeholder=\"Multiple sizes, a reference image you can email us, colour preferences, gift packaging\u2026\"></textarea>\n            </div>\n          </fieldset>\n\n          <button class=\"btn btn--block\" type=\"submit\">Send my request</button>\n          <p class=\"form-status\" role=\"status\"></p>\n          <p class=\"form-note\" style=\"margin-top:.75rem\">\n            Prefer email? Send your idea straight to <a href=\"mailto:hello@chapterbyemm.com\">hello@chapterbyemm.com</a> \u2014 attach reference images if you have them.\n          </p>\n        </form>\n      </div>\n    </section>\n\n    <section class=\"section shell\">\n      <div class=\"section-head\">\n        <div>\n          <span class=\"eyebrow\">Ready to personalise</span>\n          <h2>Or start from a template</h2>\n          <p class=\"lede\">These designs are already set up for your own names and wording \u2014 add yours at checkout and we'll proof it before printing.</p>\n        </div>\n        <a class=\"link-arrow\" href=\"shop.html?collection=custom\">Shop personalized tees <span aria-hidden=\"true\">\u2192</span></a>\n      </div>\n      <div class=\"grid grid--4\" data-related></div>\n    </section>", "faq.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">FAQ</span>\n      </nav>\n      <span class=\"eyebrow\">Help centre</span>\n      <h1>Frequently asked questions</h1>\n      <p class=\"lede\" style=\"max-width:60ch\">Everything about sizing, fabric, printing, care, delivery and returns. Still stuck? <a href=\"contact.html\">Send us a message</a> \u2014 we usually reply the same day.</p>\n    </header>\n\n    <section class=\"shell\" style=\"padding-bottom:var(--section-y)\">\n      <div class=\"faq-search\">\n        <label for=\"faq-search\">Search the FAQ</label>\n        <input id=\"faq-search\" type=\"search\" placeholder=\"e.g. shrink, tracking, exchange\u2026\" data-faq-search>\n      </div>\n      <p class=\"faq-empty\">No answers matched that search. <a href=\"contact.html\">Ask us directly</a> and we'll add it here.</p>\n\n      <!-- FAQ content is rendered from FAQ_GROUPS in assets/js/data.js -->\n      <div class=\"prose\" style=\"max-width:none\" data-faq></div>\n    </section>\n\n    <section class=\"section section--tint\">\n      <div class=\"shell center\">\n        <span class=\"eyebrow\">Still have a question?</span>\n        <h2>We're a small team and we answer every email</h2>\n        <p class=\"lede\" style=\"max-width:46ch;margin-inline:auto\">Sizing advice, order changes, bulk quotes \u2014 just ask.</p>\n        <div class=\"hero-cta\" style=\"justify-content:center;margin-top:1.5rem\">\n          <a class=\"btn\" href=\"contact.html\">Contact us</a>\n          <a class=\"btn btn--ghost\" href=\"mailto:hello@chapterbyemm.com\">hello@chapterbyemm.com</a>\n        </div>\n      </div>\n    </section>", "contact.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">Contact</span>\n      </nav>\n      <span class=\"eyebrow\">We reply within 1 business day</span>\n      <h1>Get in touch</h1>\n      <p class=\"lede\" style=\"max-width:58ch\">Questions about sizing, an order on its way, a custom idea or a bulk enquiry \u2014 we read every message ourselves.</p>\n    </header>\n\n    <section class=\"shell\" style=\"padding-bottom:var(--section-y)\">\n      <div class=\"contact-layout\">\n        <form data-form=\"contact\" data-success=\"Thank you \u2014 your message is with us and we'll reply within 1 business day.\" novalidate\n              style=\"background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:clamp(1.25rem,1rem+2vw,2.25rem)\">\n          <h2 style=\"font-size:var(--step-1)\">Send a message</h2>\n          <div class=\"field-row\">\n            <div class=\"field\">\n              <label for=\"name\">Your name</label>\n              <input id=\"name\" name=\"name\" type=\"text\" required autocomplete=\"name\">\n            </div>\n            <div class=\"field\">\n              <label for=\"email\">Email address</label>\n              <input id=\"email\" name=\"email\" type=\"email\" required autocomplete=\"email\">\n            </div>\n          </div>\n          <div class=\"field\">\n            <label for=\"topic\">What's this about?</label>\n            <select id=\"topic\" name=\"topic\" required>\n              <option value=\"\">Choose a topic\u2026</option>\n              <option>Sizing or fit advice</option>\n              <option>An existing order</option>\n              <option>Returns or exchanges</option>\n              <option>Custom or personalised tees</option>\n              <option>Bulk / wholesale enquiry</option>\n              <option>Collaboration</option>\n              <option>Something else</option>\n            </select>\n          </div>\n          <div class=\"field\">\n            <label for=\"order\">Order number (if you have one)</label>\n            <input id=\"order\" name=\"order\" type=\"text\" placeholder=\"e.g. CBE-102938\">\n          </div>\n          <div class=\"field\">\n            <label for=\"message\">Message</label>\n            <textarea id=\"message\" name=\"message\" required placeholder=\"Tell us how we can help\u2026\"></textarea>\n          </div>\n          <button class=\"btn btn--block\" type=\"submit\">Send message</button>\n          <p class=\"form-status\" role=\"status\"></p>\n          <p class=\"form- const META = {"index.html": {"page": "home", "title": "ChapterByEmm \u2014 Printed Cotton T-Shirts | Designs for Every New Chapter", "desc": "ChapterByEmm designs and prints premium cotton T-shirts for every chapter, mood and moment. Shop the Mama, Inspirational, Everyday and Bold collections, or request a custom printed tee."}, "shop.html": {"page": "shop", "title": "Shop Printed T-Shirts | ChapterByEmm", "desc": "Shop all ChapterByEmm printed cotton T-shirts. Filter by collection, size and colour \u2014 New Arrivals, Best Sellers, Mama, Inspirational, Everyday, Bold and Personalized tees in XS\u2013XXL."}, "product.html": {"page": "product", "title": "Printed Cotton T-Shirt | ChapterByEmm", "desc": "A premium printed cotton T-shirt by ChapterByEmm. Choose your size and colour, see fabric, fit, care and shipping details, and add it to your cart."}, "collections.html": {"page": "collections", "title": "T-Shirt Collections | ChapterByEmm", "desc": "Browse the ChapterByEmm T-shirt collections: New Arrivals, Best Sellers, Mama, Inspirational, Everyday, Bold Statement and Personalized custom printed tees."}, "about.html": {"page": "about", "title": "About ChapterByEmm \u2014 The Story Behind the Prints", "desc": "ChapterByEmm was created around the idea that every person is living through a different chapter of life. Meet Emm and learn how each physical printed T-shirt is designed and made."}, "custom-designs.html": {"page": "custom", "title": "Custom Designs \u2014 Personalized Printed T-Shirts | ChapterByEmm", "desc": "Request a personalized printed T-shirt from ChapterByEmm. Send us your idea, wording, design style, size and colour and we'll send a proof and a quote within 1\u20132 business days."}, "faq.html": {"page": "faq", "title": "FAQ \u2014 Sizing, Fabric, Shipping &amp; Returns | ChapterByEmm", "desc": "Answers to common questions about ChapterByEmm printed T-shirts: sizing and fit, fabric, print quality, washing and care, shipping and delivery times, returns and exchanges, customisation and order issues."}, "contact.html": {"page": "contact", "title": "Contact ChapterByEmm \u2014 Sizing Help, Orders &amp; Wholesale", "desc": "Get in touch with ChapterByEmm about sizing, an existing order, a custom printed T-shirt or a bulk enquiry. Email hello@chapterbyemm.com or send us a message here."}, "cart.html": {"page": "cart", "title": "Your Cart | ChapterByEmm", "desc": "Review the printed T-shirts in your ChapterByEmm cart, update sizes and quantities, apply a promo code and continue to checkout."}, "checkout.html": {"page": "checkout", "title": "Checkout | ChapterByEmm", "desc": "Secure checkout for your ChapterByEmm printed T-shirt order \u2014 enter your shipping address, choose a delivery speed and complete your purchase."}, "wishlist.html": {"page": "wishlist", "title": "Your Wishlist | ChapterByEmm", "desc": "The ChapterByEmm printed T-shirts you've saved for later."}};

window.__ROUTE__ = { page: "index.html", query: new URLSearchParams("") };

function go(target, push = true) {
  const [page, qs] = String(target).split("?");
  const file = VIEWS[page] !== undefined ? page : "index.html";

  window.__ROUTE__ = { page: file, query: new URLSearchParams(qs || "") };
  document.body.dataset.page = META[file].page;
  document.title = META[file].title;
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute("content", META[file].desc);

  const app = document.getElementById("app");
  app.innerHTML = '<main id="main">' + VIEWS[file] + "</main>";

  renderLayout();
  initPage();
  initForms();
  initReveal();
  syncWishUI();
  renderCartUI();

  if (page === "custom-designs.html") {
    renderProducts(document.querySelector("[data-related]"), byCollection("custom"));
  }

  if (push) {
    const hash = "#/" + (file === "index.html" ? "" : file + (qs ? "?" + qs : ""));
    if (location.hash !== hash) history.pushState({ target }, "", hash);
  }
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function routeFromHash() {
  const h = location.hash.replace(/^#\/?/, "");
  return h || "index.html";
}

document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href]");
  if (!a) return;
  const href = a.getAttribute("href");
  if (!href || /^(https?:|mailto:|tel:)/.test(href)) return;
  if (href.startsWith("#")) return;
  const [page, rest] = href.split("?");
  if (!page.endsWith(".html")) return;
  e.preventDefault();
  closePanels();
  const [qs, frag] = (rest || "").split("#");
  go(page + (qs ? "?" + qs : ""));
  if (frag) {
    const el = document.getElementById(frag);
    if (el) el.scrollIntoView({ behavior: "smooth" });
  }
});

window.addEventListener("popstate", () => go(routeFromHash(), false));

document.addEventListener("DOMContentLoaded", () => {
  initStickyHeader();
  initWishlistButtons();
  initCartUI();
  go(routeFromHash(), false);
  document.dispatchEvent(new CustomEvent("cart:change"));
});
