function applyImageFallback(img) {
  if (!img || img.dataset.fallbackDone) return;
  img.dataset.fallbackDone = "1";

  if (img.hasAttribute("data-nofallback")) {
    img.remove();
    return;
  }

  const w = Number(img.getAttribute("width")) || 0;
  const h = Number(img.getAttribute("height")) || 0;
  const ratio = w && h ? w / h : 0.8;
  img.src = ratio > 1.12 ? FALLBACK_IMG.wide : ratio > 0.92 ? FALLBACK_IMG.square : FALLBACK_IMG.tall;
  img.style.objectFit = "cover";
}

function initImageFallbacks() {
  /* `error` does not bubble, so listen in the capture phase — this catches
     every image inserted *after* this runs (product cards, collections…). */
  document.addEventListener(
    "error",
    (e) => {
      if (e.target && e.target.tagName === "IMG") applyImageFallback(e.target);
    },
    true
  );

  /* Static <img> tags already in the HTML start loading during page parse,
     before this script runs — their error event can fire and be missed
     before the listener above is attached. Sweep once for any that have
     already failed by the time we get here. */
  $$("img").forEach((img) => {
    if (img.complete && img.naturalWidth === 0 && img.getAttribute("src")) applyImageFallback(img);
  });
}

/* ---------- mini-cart confirmation --------------------------------------- */
/* Shows "Added to your chapter 🤍" inside the bag drawer for a few seconds
   after an item is added, instead of redirecting the customer away. */
function showDrawerConfirm() {
  const el = $("[data-drawer-confirm]");
  if (!el) return;
  el.hidden = false;
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => (el.hidden = true), 4000);
}

/* ---------- quick add (product-card hover / tap) ------------------------- */
/* Adds size XS→XXL (first in-stock size) and the product's first colour
   directly from the shop grid, so browsing stays fast. For products needing
   a colour or size decision, customers still land on the full product page —
   Quick Add is a shortcut, not a replacement for it. */
function initQuickAdd() {
  document.addEventListener("click", (e) => {
    const openBtn = e.target.closest("[data-quick-add]");
    if (openBtn) {
      e.preventDefault();
      const card = openBtn.closest(".product-card");
      const existing = card.querySelector(".quick-add-panel");
      if (existing) {
        existing.remove();
        return;
      }
      $$(".quick-add-panel").forEach((p) => p.remove());
      const product = getProduct(openBtn.dataset.quickAdd);
      if (!product) return;
      const availableSizes = product.sizes.filter((s) => !(product.soldOut || []).includes(s));
      const panel = document.createElement("div");
      panel.className = "quick-add-panel";
      panel.innerHTML = `
        <p>Select a size</p>
        <div class="quick-add-sizes">
          ${availableSizes.map((s) => `<button type="button" data-quick-size="${s}">${s}</button>`).join("")}
        </div>`;
      card.querySelector(".media").appendChild(panel);
      return;
    }

    const sizeBtn = e.target.closest("[data-quick-size]");
    if (sizeBtn) {
      e.preventDefault();
      const card = sizeBtn.closest(".product-card");
      const opener = card.querySelector("[data-quick-add]");
      const product = getProduct(opener.dataset.quickAdd);
      if (!product) return;
      Store.addToCart({ id: product.id, size: sizeBtn.dataset.quickSize, color: product.colors[0], qty: 1 });
      sizeBtn.closest(".quick-add-panel").remove();
      showDrawerConfirm();
      openPanel("#cart-drawer", "[data-open-cart]");
      return;
    }

    if (!e.target.closest(".quick-add-panel")) {
      $$(".quick-add-panel").forEach((p) => p.remove());
    }
  });
}

/* ---------- wishlist buttons (delegated) -------------------------------- */
/* Call syncWishUI() directly after re-rendering markup. Only real *state
   changes* should dispatch wishlist:change — dispatching it from inside a
   render function would re-trigger any render that listens for it. */
function syncWishUI() {
  $$("[data-wish]").forEach((b) => b.setAttribute("aria-pressed", String(Store.isWished(b.dataset.wish))));
  $$("[data-wish-count]").forEach((el) => {
    el.textContent = Store.wishlist.length;
    el.dataset.empty = String(Store.wishlist.length === 0);
  });
}

function initWishlistButtons() {
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-wish]");
    if (!btn) return;
    e.preventDefault();
    const id = btn.dataset.wish;
    const on = Store.toggleWish(id);
    const product = getProduct(id);
    toast(on ? `Saved ${product ? product.name : "item"} to your wishlist.` : "Removed from your wishlist.");
  });

  document.addEventListener("wishlist:change", syncWishUI);
}

/* ---------- Etsy links (Digital Studio callouts) ------------------------- */
function wireEtsyLinks() {
  $$("[data-etsy-link]").forEach((a) => (a.href = SITE.social.etsy));
}

alt=\"Close-up of the I'm Doing My Best retro tulip print on a terracotta T-shirt\" width=\"900\" height=\"1100\" loading=\"lazy\"></a>\n          <a href=\"https://instagram.com/chapterbyemm\" rel=\"noopener\" aria-label=\"Instagram post 6\"><img src=\"assets/img/products/stress-never-heard-2.jpg\" alt=\"Stress? Never Heard of Her powder blue T-shirt styled with a cap, bag and jeans\" width=\"900\" height=\"1100\" loading=\"lazy\"></a>\n        </div>\n      </div>\n    </section>\n\n    <!-- JOURNAL PREVIEW -->\n    <section class=\"section shell\">\n      <div class=\"section-head\">\n        <div>\n          <span class=\"eyebrow\">The Chapter Journal</span>\n          <h2>Notes From the Studio</h2>\n        </div>\n        <a class=\"link-arrow\" href=\"journal.html\">Read the Journal <span aria-hidden=\"true\">\u2192</span></a>\n      </div>\n      <div class=\"grid grid--3\" data-journal-home></div>\n    </section>\n\n    <!-- A DIFFERENT KIND OF CHAPTER \u2014 ETSY / DIGITAL STUDIO -->\n    <section class=\"section section--tint\">\n      <div class=\"shell\">\n        <div class=\"digital-studio reveal\">\n          <div>\n            <span class=\"eyebrow\">A Different Kind of Chapter</span>\n            <h2>Looking for our digital creations?</h2>\n            <p class=\"lede\">Our physical T-shirts live here. Our digital creations live on Etsy \u2014 if you're looking for ChapterByEmm's digital designs, visit our Etsy studio and explore the other side of our creativity.</p>\n          </div>\n          <a class=\"btn btn--ghost\" data-etsy-link href=\"#\" rel=\"noopener\">Explore Our Etsy Shop <span aria-hidden=\"true\">\u2192</span></a>\n        </div>\n      </div>\n    </section>", "shop.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">Shop</span>\n      </nav>\n      <span class=\"eyebrow\">Physical Printed T-Shirts \u00b7 XS\u2013XXL \u00b7 Shipped Across Pakistan</span>\n      <h1 data-shop-title>All T-Shirts</h1>\n      <p class=\"lede\" data-shop-blurb>Every ChapterByEmm design \u2014 printed to order and shipped across Pakistan.</p>\n    </header>\n\n    <section class=\"shell\">\n      <!-- Filters -->\n      <div class=\"filter-bar\" role=\"group\" aria-label=\"Filter by collection\" data-collection-chips></div>\n\n      <details style=\"margin-bottom:1.25rem\">\n        <summary class=\"chip\" style=\"display:inline-block;list-style:none\">More filters \u2014 size &amp; colour</summary>\n        <div style=\"padding-top:1rem\">\n          <p class=\"eyebrow\" style=\"margin-bottom:.6rem\">Size</p>\n          <div class=\"filter-bar\" role=\"group\" aria-label=\"Filter by size\" data-size-chips></div>\n          <p class=\"eyebrow\" style=\"margin-bottom:.6rem\">Colour</p>\n          <div class=\"filter-bar\" role=\"group\" aria-label=\"Filter by colour\" data-color-chips></div>\n        </div>\n      </details>\n\n      <div class=\"shop-toolbar\">\n        <div style=\"display:flex;gap:.75rem;align-items:center;flex-wrap:wrap\">\n          <span class=\"result-count\" data-result-count aria-live=\"polite\">12 T-shirts</span>\n          <button class=\"chip\" type=\"button\" data-clear-filters>Clear filters</button>\n        </div>\n        <div style=\"display:flex;gap:.75rem;align-items:center;flex-wrap:wrap\">\n          <div class=\"field\">\n            <label class=\"visually-hidden\" for=\"shop-search\">Search T-shirts</label>\n            <input id=\"shop-search\" type=\"search\" placeholder=\"Search designs\u2026\" data-shop-search>\n          </div>\n          <div class=\"field\">\n            <label for=\"sort\">Sort</label>\n            <select id=\"sort\" data-sort>\n              <option value=\"featured\">Featured</option>\n              <option value=\"newest\">Newest</option>\n              <option value=\"price-asc\">Price: low to high</option>\n              <option value=\"price-desc\">Price: high to low</option>\n              <option value=\"rating\">Top rated</option>\n              <option value=\"name-asc\">A\u2013Z</option>\n            </select>\n          </div>\n        </div>\n      </div>\n\n      <div class=\"grid grid--4\" data-shop-grid style=\"padding-bottom:var(--section-y)\"></div>\n    </section>\n\n    <section class=\"section section--tint\">\n      <div class=\"shell split\">\n        <div>\n          <span class=\"eyebrow\">Can't Find Your Words?</span>\n          <h2>Your Chapter. Your Design.</h2>\n          <p>Tell us the text, the style and the colour and we'll set the type by hand, send you a proof, and print it on the same blanks you see here.</p>\n          <a class=\"btn\" href=\"custom-designs.html\">Request a Custom Tee</a>\n        </div>\n        <img src=\"assets/img/products/doing-my-best-1.jpg\" alt=\"Close-up of the I'm Doing My Best retro tulip print on a terracotta T-shirt\" width=\"900\" height=\"1100\" loading=\"lazy\" style=\"border-radius:var(--radius-lg)\">\n      </div>\n    </section>", "product.html": "<!-- Product content is rendered from assets/js/data.js -->\n    <div class=\"shell page-head\" data-pdp></div>\n\n    <section class=\"section section--tint\">\n      <div class=\"shell\">\n        <div class=\"section-head section-head--center\">\n          <div>\n            <span class=\"eyebrow\">Reviews</span>\n            <h2>Loved by the ChapterByEmm Community</h2>\n          </div>\n        </div>\n        <div class=\"grid grid--3\" data-reviews=\"3\"></div>\n      </div>\n    </section>\n\n    <section class=\"section shell\">\n      <div class=\"section-head\">\n        <div>\n          <span class=\"eyebrow\">You May Also Like</span>\n          <h2>Related T-Shirts</h2>\n        </div>\n        <a class=\"link-arrow\" href=\"shop.html\">Shop All <span aria-hidden=\"true\">\u2192</span></a>\n      </div>\n      <div class=\"grid grid--4\" data-related></div>\n    </section>", "collections.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">Collections</span>\n      </nav>\n      <span class=\"eyebrow\">The Collections</span>\n      <h1>Find the Chapter You're In</h1>\n      <p class=\"lede\">Each collection is a different season of life. Every design is a physical printed T-shirt, available in XS\u2013XXL and printed to order.</p>\n    </header>\n\n    <section class=\"shell\" style=\"padding-bottom:var(--section-y)\">\n      <div class=\"grid grid--3\" data-collections-all></div>\n    </section>\n\n    <section class=\"section section--sand\">\n      <div class=\"shell split\">\n        <div>\n          <span class=\"eyebrow\">Custom</span>\n          <h2>Your Words, Printed by Hand</h2>\n          <p>Every collection can be personalised. Send us the names, dates or line you want printed and we'll set the type, send you a proof, and print it on the blank of your choice.</p>\n          <a class=\"btn\" href=\"custom-designs.html\">Start a Custom Design</a>\n        </div>\n        <img src=\"assets/img/products/doing-my-best-1.jpg\" alt=\"Close-up of the I'm Doing My Best retro tulip print on a terracotta T-shirt\" width=\"900\" height=\"1100\" loading=\"lazy\" style=\"border-radius:var(--radius-lg)\">\n      </div>\n    </section>", "about.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">Our Story</span>\n      </nav>\n      <span class=\"eyebrow\">Our Story</span>\n      <h1>Every Design Begins a New Chapter</h1>\n      <p class=\"lede\" style=\"max-width:60ch\">Every person is living through a different chapter of life \u2014 and ChapterByEmm's T-shirts are designed to express those moments.</p>\n    </header>\n\n    <section class=\"shell\" style=\"padding-bottom:var(--section-y)\">\n      <img src=\"assets/img/products/calm-superpower-2.jpg\" alt=\"A ChapterByEmm kelly green T-shirt worn with jeans and white trainers\" width=\"900\" height=\"1100\" style=\"border-radius:var(--radius-lg)\" decoding=\"async\">\n    </section>\n\n    <section class=\"section section--tint\">\n      <div class=\"shell split\">\n        <div class=\"prose\">\n          <span class=\"eyebrow\">From Emm</span>\n          <p>Every chapter in life begins with a small step, and this is mine.</p>\n          <p>I'm a women's health physiotherapist by profession, someone who spends her days helping others heal, grow, and feel stronger in their own bodies. But beyond my work, I've always carried a quiet love for art, painting, creating, and turning simple ideas into something meaningful and beautiful.</p>\n          <p>For a long time, that creative side of me stayed in the background\u2026 until one day, I decided to give it a space of its own. With hope in my heart and countless prayers, I started this journey on Etsy, my little corner where creativity meets purpose.</p>\n\n          <blockquote class=\"pull-quote\">\u201cChapterByEmm\u201d isn't just a shop. It's a reflection of new beginnings, of choosing to start even when you're unsure, and of believing that something beautiful can come from simply trying.</blockquote>\n\n          <p>Every design you see here is created with care, intention, and love. My goal is simple \u2014 to make things that you'll not only use or wear, but genuinely enjoy\u2026 pieces that feel a little special, a little personal, and a little like you.</p>\n          <p>That love for design has now grown into something you can wear: physical, printed T-shirts, made to order and shipped across Pakistan \u2014 a new chapter for a brand that began with digital art on Etsy.</p>\n          <p>I'm still learning, still growing, and still writing this chapter \u2014 but I'm grateful you're here, being a part of it.</p>\n          <p class=\"signature\" style=\"margin-top:1.5rem\">Here's to new beginnings, creativity, and finding joy in the little things.<br>\u2014 Emm, founder</p>\n        </div>\n        <img src=\"assets/img/products/doing-my-best-2.jpg\" alt=\"A ChapterByEmm terracotta T-shirt laid out with jeans and jewellery\" width=\"900\" height=\"1100\" loading=\"lazy\" style=\"border-radius:var(--radius-lg)\">\n      </div>\n    </section>\n\n    <section class=\"section shell\">\n      <div class=\"section-head section-head--center\">\n        <div>\n          <span class=\"eyebrow\">What You Can Count On</span>\n          <h2>Our Promises</h2>\n        </div>\n      </div>\n      <div class=\"value-grid\">\n        <div class=\"value reveal\">\n          <h3>Real Garments, Made to Last</h3>\n          <p>Every order is a physical printed T-shirt \u2014 never a digital download. Fabric and print details are listed honestly on each product page.</p>\n        </div>\n        <div class=\"value reveal\">\n          <h3>Made to Order</h3>\n          <p>Printed once you order, in small batches. Nothing mass-produced, nothing sitting in a warehouse.</p>\n        </div>\n        <div class=\"value reveal\">\n          <h3>Honest Sizing</h3>\n          <p>A real size guide on every product page, and a human who'll answer your sizing question on WhatsApp or email.</p>\n        </div>\n        <div class=\"value reveal\">\n          <h3>Care After Checkout</h3>\n          <p>Cash on Delivery, tracked shipping, and a straightforward <a href=\"returns-exchanges.html\">returns &amp; exchanges</a> process if anything's wrong.</p>\n        </div>\n      </div>\n    </section>\n\n    <section class=\"section section--sand\">\n      <div class=\"shell center\">\n        <span class=\"eyebrow\">Start Yours</span>\n        <h2>Which Chapter Are You In?</h2>\n        <p class=\"lede\" style=\"max-width:48ch;margin-inline:auto\">Browse the collections, or tell us your words and we'll print them for you.</p>\n        <div class=\"hero-cta\" style=\"justify-content:center;margin-top:1.5rem\">\n          <a class=\"btn\" href=\"shop.html\">Shop the Collection</a>\n          <a class=\"btn btn--ghost\" href=\"custom-designs.html\">Request a Custom Tee</a>\n        </div>\n      </div>\n    </section>", "custom-designs.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">Custom</span>\n      </nav>\n      <span class=\"eyebrow\">Custom T-Shirts</span>\n      <h1>Your Chapter. Your Design.</h1>\n      <p class=\"lede\" style=\"max-width:60ch\">Have something in mind? Tell us your idea and let's turn it into something you can wear.</p>\n    </header>\n\n    <section class=\"shell\" style=\"padding-bottom:var(--section-y)\">\n      <div class=\"split\">\n        <div>\n          <img src=\"assets/img/products/stress-never-heard-3.jpg\" alt=\"A ChapterByEmm custom printed T-shirt worn with mom jeans\" width=\"900\" height=\"1100\" style=\"border-radius:var(--radius-lg)\" decoding=\"async\">\n        </div>\n        <div>\n          <span class=\"eyebrow\">How It Works</span>\n          <h2>Four Simple Steps</h2>\n          <ol class=\"prose\" style=\"padding-left:1.2rem\">\n            <li><strong>Tell us your idea.</strong> Fill in the form below with your wording, style, size and colour.</li>\n            <li><strong>We reply with a proof.</strong> Within 1\u20132 business days you'll get a mock-up and a firm quote on WhatsApp or email.</li>\n            <li><strong>You approve it.</strong> Nothing is printed until you're happy \u2014 small tweaks are free.</li>\n            <li><strong>We print and ship.</strong> Custom tees are printed in 3\u20135 business days, then dispatched nationwide.</li>\n          </ol>\n          <p class=\"hint\">Pricing depends on placement, colours and quantity \u2014 we'll confirm your exact price with the quote. Bulk pricing available from 6 shirts for family occasions, small businesses and group gifts.</p>\n        </div>\n      </div>\n    </section>\n\n    <section class=\"section section--tint\">\n      <div class=\"shell\" style=\"max-width:840px\">\n        <div class=\"section-head section-head--center\">\n          <div>\n            <span class=\"eyebrow\">Request Form</span>\n            <h2>Tell Us What to Print</h2>\n            <p class=\"lede\">The more detail you give us, the closer the first proof will be.</p>\n          </div>\n        </div>\n\n        <form data-form=\"custom-design\" data-success=\"Thank you \u2014 your request is with Emm. You'll hear back on WhatsApp or email within 1\u20132 business days.\" novalidate\n              style=\"background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:clamp(1.25rem,1rem+2vw,2.25rem)\">\n\n          <fieldset>\n            <legend>Your Details</legend>\n            <div class=\"field-row\">\n              <div class=\"field\">\n                <label for=\"name\">Full name</label>\n                <input id=\"name\" name=\"name\" type=\"text\" required autocomplete=\"name\">\n              </div>\n              <div class=\"field\">\n                <label for=\"email\">Email address</label>\n                <input id=\"email\" name=\"email\" type=\"email\" required autocomplete=\"email\">\n              </div>\n            </div>\n            <div class=\"field\">\n              <label for=\"whatsapp\">WhatsApp number</label>\n              <input id=\"whatsapp\" name=\"whatsapp\" type=\"tel\" required autocomplete=\"tel\" placeholder=\"03XX XXXXXXX\">\n              <p class=\"hint\">We'll send your proof and quote here \u2014 it's usually the fastest way to reach us.</p>\n            </div>\n          </fieldset>\n\n          <fieldset>\n            <legend>Your Design</legend>\n            <div class=\"field\">\n              <label for=\"idea\">Design idea</label>\n              <textarea id=\"idea\" name=\"idea\" required placeholder=\"Tell us what this tee is for \u2014 a birthday, a new baby, a milestone, an inside joke\u2026\"></textarea>\n            </div>\n            <div class=\"field\">\n              <label for=\"text\">Text / name to print</label>\n              <input id=\"text\" name=\"text\" type=\"text\" required maxlength=\"80\" placeholder=\"e.g. Mama of Three \u00b7 Est. 2019\">\n              <p class=\"hint\">Type it exactly as you'd like it printed, including capitals and punctuation.</p>\n            </div>\n            <div class=\"field-row\">\n              <div class=\"field\">\n                <label for=\"style\">Preferred style</label>\n                <select id=\"style\" name=\"style\" required>\n                  <option value=\"\">Choose a style\u2026</option>\n                  <option>Soft serif (our signature)</option>\n                  <option>Hand-lettered script</option>\n                  <option>Minimal lowercase sans</option>\n                  <option>Bold statement caps</option>\n                  <option>Small centre-chest print</option>\n                  <option>Not sure \u2014 suggest something</option>\n                </select>\n              </div>\n              <div class=\"field\">\n                <label for=\"placement\">Print placement</label>\n                <select id=\"placement\" name=\"placement\">\n                  <option>Centre chest</option>\n                  <option>Left chest (small)</option>\n                  <option>Full front</option>\n                  <option>Back print</option>\n                  <option>Front and back</option>\n                </select>\n              </div>\n            </div>\n            <div class=\"field\">\n              <label for=\"reference\">Reference image (optional)</label>\n              <input id=\"reference\" name=\"reference\" type=\"file\" accept=\"image/*\">\n              <p class=\"hint\">A screenshot, sketch or photo of what you have in mind helps a lot.</p>\n            </div>\n          </fieldset>\n\n          <fieldset>\n            <legend>Shirt Details</legend>\n            <div class=\"field-row\">\n              <div class=\"field\">\n                <label for=\"size\">Size</label>\n                <select id=\"size\" name=\"size\" required data-custom-sizes></select>\n              </div>\n              <div class=\"field\">\n                <label for=\"color\">Shirt colour</label>\n                <select id=\"color\" name=\"color\" required data-custom-colors></select>\n              </div>\n              <div class=\"field\">\n                <label for=\"qty\">Quantity</label>\n                <input id=\"qty\" name=\"qty\" type=\"number\" min=\"1\" max=\"200\" value=\"1\" required>\n              </div>\n            </div>\n            <div class=\"field\">\n              <label for=\"notes\">Additional notes</label>\n              <textarea id=\"notes\" name=\"notes\" style=\"min-height:110px\" placeholder=\"Multiple sizes, colour preferences, a deadline, gift packaging\u2026\"></textarea>\n            </div>\n          </fieldset>\n\n          <button class=\"btn btn--block\" type=\"submit\">Submit My Idea</button>\n          <p class=\"form-status\" role=\"status\"></p>\n          <p class=\"form-note\" style=\"margin-top:.75rem\">\n            Prefer WhatsApp? Message us directly at <a href=\"https://wa.me/923000000000\" rel=\"noopener\">wa.me/923000000000</a> \u2014 attach reference images if you have them.\n          </p>\n        </form>\n      </div>\n    </section>\n\n    <section class=\"section shell\">\n      <div class=\"section-head\">\n        <div>\n          <span class=\"eyebrow\">Ready to Personalise</span>\n          <h2>Or Start From an Existing Design</h2>\n          <p class=\"lede\">Pick any print in the shop as a starting point \u2014 we can change the wording, the colours or the placement to make it yours.</p>\n        </div>\n        <a class=\"link-arrow\" href=\"shop.html\">Shop All T-Shirts <span aria-hidden=\"true\">\u2192</span></a>\n      </div>\n      <div class=\"grid grid--4\" data-related></div>\n    </section>", "size-guide.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">Size Guide</span>\n      </nav>\n      <span class=\"eyebrow\">Sizing</span>\n      <h1>Size Guide</h1>\n      <p class=\"lede\" style=\"max-width:60ch\">All measurements are in inches and taken from the finished garment. If you're between two sizes, size up for a looser, more draped look, or size down for a closer fit.</p>\n    </header>\n\n    <section class=\"shell\" style=\"padding-bottom:var(--section-y)\">\n      <div class=\"table-wrap\" data-size-chart></div>\n      <p class=\"hint\" style=\"margin-top:1rem\">Each product page also lists its specific fit \u2014 relaxed, oversized, or our more fitted cut \u2014 alongside this chart.</p>\n    </section>\n\n    <section class=\"section section--tint\">\n      <div class=\"shell\">\n        <div class=\"section-head section-head--center\">\n          <div>\n            <span class=\"eyebrow\">How to Measure</span>\n            <h2>Three Quick Measurements</h2>\n            <p class=\"lede\">Use a soft measuring tape, or lay a T-shirt you already own flat and measure that instead.</p>\n          </div>\n        </div>\n        <div class=\"measure-guide\">\n          <div class=\"measure-step reveal\">\n            <strong>1. Chest</strong>\n            <p>Measure around the fullest part of your chest, keeping the tape level and snug but not tight.</p>\n          </div>\n          <div class=\"measure-step reveal\">\n            <strong>2. Body Length</strong>\n            <p>Measure from the highest point of the shoulder straight down to where you'd like the hem to sit.</p>\n          </div>\n          <div class=\"measure-step reveal\">\n            <strong>3. Sleeve</strong>\n            <p>Measure from the shoulder seam to the end of the sleeve.</p>\n          </div>\n        </div>\n      </div>\n    </section>\n\n    <section class=\"section shell center\">\n      <span class=\"eyebrow\">Still unsure?</span>\n      <h2>We're happy to help you pick a size</h2>\n      <p class=\"lede\" style=\"max-width:46ch;margin-inline:auto\">Send us your usual size and height on WhatsApp or email and we'll recommend the best fit for the style you want.</p>\n      <div class=\"hero-cta\" style=\"justify-content:center;margin-top:1.5rem\">\n        <a class=\"btn\" href=\"contact.html\">Contact Us</a>\n        <a class=\"btn btn--ghost\" href=\"shop.html\">Shop the Collection</a>\n      </div>\n    </section>", "journal.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">Journal</span>\n      </nav>\n      <span class=\"eyebrow\">The Chapter Journal</span>\n      <h1>Notes From the Studio</h1>\n      <p class=\"lede\" style=\"max-width:60ch\">Styling ideas, the stories behind our designs, and the small, ordinary parts of building ChapterByEmm from scratch.</p>\n    </header>\n\n    <section class=\"shell\" style=\"padding-bottom:var(--section-y)\">\n      <div class=\"grid grid--3\" data-journal-grid></div>\n    </section>", "journal-post.html": "<div class=\"shell page-head\" data-journal-post></div>\n\n    <section class=\"section section--tint\">\n      <div class=\"shell\">\n        <div class=\"section-head\">\n          <div>\n            <span class=\"eyebrow\">More From the Journal</span>\n            <h2>Keep Reading</h2>\n          </div>\n          <a class=\"link-arrow\" href=\"journal.html\">All Entries <span aria-hidden=\"true\">\u2192</span></a>\n        </div>\n        <div class=\"grid grid--3\" data-journal-related></div>\n      </div>\n    </section>", "shipping.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">Shipping &amp; Delivery</span>\n      </nav>\n      <span class=\"eyebrow\">Nationwide Delivery</span>\n      <h1>Shipping &amp; Delivery</h1>\n      <p class=\"lede\" style=\"max-width:60ch\">Every ChapterByEmm order is a physical printed T-shirt, made after you order and shipped from our studio in Pakistan.</p>\n    </header>\n\n    <section class=\"shell prose\" style=\"padding-bottom:var(--section-y)\">\n      <h2>Where We Deliver</h2>\n      <p>We currently ship nationwide across Pakistan, including all major cities and most surrounding areas. If you're unsure whether we deliver to your area, message us on WhatsApp before ordering and we'll confirm.</p>\n\n      <h2>Order Processing</h2>\n      <p>Every tee is printed to order rather than pulled from a shelf. Printing and quality-checking typically takes <strong>2\u20134 business days</strong>. Custom or personalised orders take a little longer \u2014 <strong>3\u20135 business days</strong> \u2014 because we confirm a proof with you before printing.</p>\n\n      <h2>Delivery Times &amp; Charges</h2>\n      <div class=\"table-wrap\">\n        <table>\n          <thead><tr><th>Method</th><th>Estimated Delivery</th><th>Charge</th></tr></thead>\n          <tbody data-shipping-table></tbody>\n        </table>\n      </div>\n      <p class=\"hint\">Standard delivery is free on orders above <span data-free-shipping-amount></span>. Delivery times begin once your order has finished printing, not from the moment you place it. [EDIT] Confirm these figures once your courier is finalised.</p>\n\n      <h2>Tracking Your Order</h2>\n      <p>[EDIT] Add your tracking process here once confirmed with your courier \u2014 for example, a tracking number sent by SMS or WhatsApp once your parcel is dispatched.</p>\n\n      <h2>Delivery Exceptions</h2>\n      <p>Occasionally, deliveries to remote areas, during public holidays, or affected by weather may take longer than the estimates above. If your order is significantly delayed, message us and we'll follow up with the courier on your behalf.</p>\n\n      <h2>Cash on Delivery</h2>\n      <p>Cash on Delivery is available nationwide \u2014 you pay in cash when your order arrives. Bank Transfer is also accepted; online card and wallet payment is coming soon.</p>\n    </section>\n\n    <section class=\"section section--sand\">\n      <div class=\"shell center\">\n        <span class=\"eyebrow\">Questions?</span>\n        <h2>We're happy to help before you order</h2>\n        <div class=\"hero-cta\" style=\"justify-content:center;margin-top:1.5rem\">\n          <a class=\"btn\" href=\"contact.html\">Contact Us</a>\n          <a class=\"btn btn--ghost\" href=\"faq.html\">Read the FAQ</a>\n        </div>\n      </div>\n    </section>", "returns-exchanges.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">Returns &amp; Exchanges</span>\n      </nav>\n      <span class=\"eyebrow\">Our Policy</span>\n      <h1>Returns &amp; Exchanges</h1>\n      <p class=\"lede\" style=\"max-width:60ch\">We want you to be happy with what you ordered. Here's how returns and exchanges work.</p>\n    </header>\n\n    <section class=\"shell prose\" style=\"padding-bottom:var(--section-y)\">\n      <h2>Return Eligibility</h2>\n      <p>[EDIT] Confirm and add your return window here (for example, \"within 7 days of delivery\"). Returned items should be unworn, unwashed, and in their original condition with tags attached.</p>\n\n      <h2>Exchange Eligibility</h2>\n      <p>[EDIT] Confirm your exchange window and conditions here. In general, unworn items in original condition are eligible for a size or colour exchange, subject to stock availability.</p>\n\n      <h2>Size Exchanges</h2>\n      <p>Ordered the wrong size? Message us on WhatsApp or email with your order number and the size you need. [EDIT] Confirm whether size exchanges are free or carry a delivery charge.</p>\n\n      <h2>Damaged or Incorrect Products</h2>\n      <p>If your order arrives damaged, faulty, or different from what you ordered, message us a photo within 7 days of delivery. We'll arrange a reprint or replacement at no extra cost to you.</p>\n\n      <h2>Custom &amp; Personalised Orders</h2>\n      <p>Because custom tees are printed to your exact request and confirmed with a proof beforehand, they can only be returned or exchanged if there is a fault or printing error on our side.</p>\n\n      <h2>How to Start a Return or Exchange</h2>\n      <ol>\n        <li>Message us on WhatsApp or email with your order number and the reason for the return.</li>\n        <li>We'll confirm eligibility and the next steps, including where to send the item back if needed.</li>\n        <li>Once received and checked, we'll process your exchange or refund.</li>\n      </ol>\n\n      <h2>Refund Process</h2>\n      <p>[EDIT] Confirm your refund process here \u2014 for example, whether refunds are issued via bank transfer, and how long they typically take once approved.</p>\n    </section>\n\n    <section class=\"section section--sand\">\n      <div class=\"shell center\">\n        <span class=\"eyebrow\">Need to Start a Return?</span>\n        <h2>We're here to help</h2>\n        <div class=\"hero-cta\" style=\"justify-content:center;margin-top:1.5rem\">\n          <a class=\"btn\" href=\"contact.html\">Contact Us</a>\n          <a class=\"btn btn--ghost\" href=\"size-guide.html\">Check the Size Guide</a>\n        </div>\n      </div>\n    </section>", "faq.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">FAQ</span>\n      </nav>\n      <span class=\"eyebrow\">Help centre</span>\n      <h1>Frequently asked questions</h1>\n      <p class=\"lede\" style=\"max-width:60ch\">Everything about sizing, fabric, printing, care, delivery and returns. Still stuck? <a href=\"contact.html\">Send us a message</a> \u2014 we usually reply the same day.</p>\n    </header>\n\n    <section class=\"shell\" style=\"padding-bottom:var(--section-y)\">\n      <div class=\"faq-search\">\n        <label for=\"faq-search\">Search the FAQ</label>\n        <input id=\"faq-search\" type=\"search\" placeholder=\"e.g. shrink, tracking, exchange\u2026\" data-faq-search>\n      </div>\n      <p class=\"faq-empty\">No answers matched that search. <a href=\"contact.html\">Ask us directly</a> and we'll add it here.</p>\n\n      <!-- FAQ content is rendered from FAQ_GROUPS in assets/js/data.js -->\n      <div class=\"prose\" style=\"max-width:none\" data-faq></div>\n    </section>\n\n    <section class=\"section section--tint\">\n      <div class=\"shell center\">\n        <span class=\"eyebrow\">Still have a question?</span>\n        <h2>We're a small team and we answer every email</h2>\n        <p class=\"lede\" style=\"max-width:46ch;margin-inline:auto\">Sizing advice, order changes, bulk quotes \u2014 just ask.</p>\n        <div class=\"hero-cta\" style=\"justify-content:center;margin-top:1.5rem\">\n          <a class=\"btn\" href=\"contact.html\">Contact us</a>\n          <a class=\"btn btn--ghost\" href=\"mailto:hello@chapterbyemm.com\">hello@chapterbyemm.com</a>\n        </div>\n      </div>\n    </section>", "contact.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">Contact</span>\n      </nav>\n      <span class=\"eyebrow\">We reply within 1 business day</span>\n      <h1>Get in Touch</h1>\n      <p class=\"lede\" style=\"max-width:58ch\">Questions about sizing, an order on its way, a custom idea or a bulk enquiry \u2014 we read every message ourselves.</p>\n    </header>\n\n    <section class=\"shell\" style=\"padding-bottom:var(--section-y)\">\n      <div class=\"contact-layout\">\n        <form data-form=\"contact\" data-success=\"Thank you \u2014 your message is with us and we'll reply within 1 business day.\" novalidate\n              style=\"background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:clamp(1.25rem,1rem+2vw,2.25rem)\">\n          <h2 style=\"font-size:var(--step-1)\">Send a Message</h2>\n          <div class=\"field-row\">\n            <div class=\"field\">\n              <label for=\"name\">Your name</label>\n              <input id=\"name\" name=\"name\" type=\"text\" required autocomplete=\"name\">\n            </div>\n            <div class=\"field\">\n              <label for=\"email\">Email address</label>\n              <input id=\"email\" name=\"email\" type=\"email\" required autocomplete=\"email\">\n            </div>\n          </div>\n          <div class=\"field\">\n            <label for=\"phone\">Phone / WhatsApp (optional)</label>\n            <input id=\"phone\" name=\"phone\" type=\"tel\" autocomplete=\"tel\" placeholder=\"03XX XXXXXXX\">\n          </div>\n          <div class=\"field\">\n            <label for=\"topic\">What's this about?</label>\n            <select id=\"topic\" name=\"topic\" required>\n              <option value=\"\">Choose a topic\u2026</option>\n              <option>Sizing or fit advice</option>\n              <option>An existing order</option>\n              <option>Returns or exchanges</option>\n              <option>Custom T-shirt request</option>\n              <option>Bulk / group order</option>\n              <option>Collaboration</option>\n              <option>Something else</option>\n            </select>\n          </div>\n          <div class=\"field\">\n            <label for=\"order\">Order number (if you have one)</label>\n            <input id=\"order\" name=\"order\" type=\"text\" placeholder=\"e.g. CBE-102938\">\n          </div>\n          <div class=\"field\">\n            <label for=\"message\">Message</label>\n            <textarea id=\"message\" name=\"message\" required placeholder=\"Tell us how we can help\u2026\"></textarea>\n          </div>\n          <button class=\"btn btn--block\" type=\"submit\">Send Message</button>\n          <p class=\"form-status\" role=\"status\"></p>\n          <p class=\"form-note\" style=\"margin-top:.75rem\">We'll only use your details to reply to this enquiry.</p>\n        </form>\n\n        <div>\n          <div class=\"info-card\">\n            <h3>Message Us</h3>\n            <p>WhatsApp is the fastest way to reach us \u2014 we answer in the order messages arrive, usually within one business day.</p>\n            <p><a href=\"#\" data-whatsapp-link rel=\"noopener\">WhatsApp</a></p>\n            <!-- REPLACE: your real business email (also update it in assets/js/data.js) -->\n            <p><a href=\"mailto:hello@chapterbyemm.com\" data-email-link>hello@chapterbyemm.com</a></p>\n            <p class=\"hint\">Monday\u2013Saturday, 10am\u20136pm</p>\n          </div>\n\n          <div class=\"info-card\">\n            <h3>Follow Along</h3>\n            <p>New prints, restocks and behind the scenes in the studio.</p>\n            <!-- REPLACE: your real social links (also in assets/js/data.js) -->\n            <ul class=\"social-list\">\n              <li><a href=\"https://instagram.com/chapterbyemm\" rel=\"noopener\">Instagram \u2014 @chapterbyemm</a></li>\n              <li><a href=\"https://pinterest.com/chapterbyemm\" rel=\"noopener\">Pinterest \u2014 @chapterbyemm</a></li>\n              <li><a href=\"https://facebook.com/chapterbyemm\" rel=\"noopener\">Facebook \u2014 ChapterByEmm</a></li>\n            </ul>\n          </div>\n\n          <div class=\"info-card\">\n            <h3>Studio &amp; Shipping</h3>\n            <p>Every tee is printed and packed by hand, then shipped nationwide with tracking.</p>\n            <p class=\"muted\" data-studio-location>Lahore, Pakistan<br>Printing takes 2\u20134 business days<br>Standard delivery 3\u20136 business days</p>\n            <p style=\"margin-top:1rem\"><a class=\"link-arrow\" href=\"shipping.html\">Shipping details <span aria-hidden=\"true\">\u2192</span></a></p>\n          </div>\n\n          <div class=\"info-card\">\n            <h3>Looking for Digital Designs?</h3>\n            <p>This website is for physical printed T-shirts. Our digital creations live on Etsy.</p>\n            <p><a href=\"#\" data-etsy-link rel=\"noopener\">Visit our Etsy shop \u2192</a></p>\n          </div>\n\n          <div class=\"info-card\">\n            <h3>Before You Write</h3>\n            <p>Sizing, care, delivery times and returns are all answered on our <a href=\"faq.html\">FAQ page</a> \u2014 it's often the quickest answer.</p>\n          </div>\n        </div>\n      </div>\n    </section>", "privacy.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">Privacy Policy</span>\n      </nav>\n      <h1 style=\"font-size:var(--step-3)\">Privacy Policy</h1>\n      <p class=\"lede\">Last updated: [EDIT \u2014 add the date you publish this page]</p>\n    </header>\n\n    <section class=\"shell prose\" style=\"padding-bottom:var(--section-y)\">\n      <p>[EDIT] This is a starting template \u2014 replace the sections below with your actual privacy practices, or have them reviewed to make sure they meet the requirements that apply to your business.</p>\n\n      <h2>Information We Collect</h2>\n      <p>When you place an order, contact us, or sign up for our newsletter, we may collect your name, email address, phone/WhatsApp number, and delivery address.</p>\n\n      <h2>How We Use Your Information</h2>\n      <p>We use this information to process and deliver your order, respond to your enquiries, and \u2014 only if you opt in \u2014 send occasional emails about new prints and restocks. We do not sell your information to third parties.</p>\n\n      <h2>Cash on Delivery &amp; Payment Information</h2>\n      <p>We do not store card details. Cash on Delivery and Bank Transfer orders are confirmed directly with you; any future online payment gateway will process payment details securely through its own provider, not through ChapterByEmm's servers.</p>\n\n      <h2>Cookies &amp; Local Storage</h2>\n      <p>This website stores your bag and wishlist in your browser's local storage so they're there when you come back. This information stays on your device and is not sent to us.</p>\n\n      <h2>Your Rights</h2>\n      <p>You can ask us what information we hold about you, or ask us to delete it, at any time by contacting us.</p>\n\n      <h2>Contact Us</h2>\n      <p>Questions about this policy? <a href=\"contact.html\">Get in touch</a>.</p>\n    </section>", "terms.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">Terms &amp; Conditions</span>\n      </nav>\n      <h1 style=\"font-size:var(--step-3)\">Terms &amp; Conditions</h1>\n      <p class=\"lede\">Last updated: [EDIT \u2014 add the date you publish this page]</p>\n    </header>\n\n    <section class=\"shell prose\" style=\"padding-bottom:var(--section-y)\">\n      <p>[EDIT] This is a starting template \u2014 replace the sections below with your actual terms, or have them reviewed to make sure they meet the requirements that apply to your business.</p>\n\n      <h2>About ChapterByEmm</h2>\n      <p>ChapterByEmm sells physical, printed T-shirts, made to order and shipped across Pakistan. This website does not sell digital products \u2014 our digital designs are available separately through our Etsy shop.</p>\n\n      <h2>Orders &amp; Pricing</h2>\n      <p>All prices are listed in Pakistani Rupees (Rs. / PKR) and include applicable costs unless stated otherwise at checkout. We reserve the right to correct pricing errors and to cancel an order affected by one, with a full refund where payment has already been made.</p>\n\n      <h2>Payment</h2>\n      <p>We currently accept Cash on Delivery and Bank Transfer. Online card and wallet payment is coming soon. Cash on Delivery orders are paid in cash at the time of delivery.</p>\n\n      <h2>Custom Orders</h2>\n      <p>Custom and personalised tees are printed only after you approve a proof. Once approved and printing has begun, custom orders cannot be cancelled or changed.</p>\n\n      <h2>Shipping</h2>\n      <p>See our <a href=\"shipping.html\">Shipping &amp; Delivery</a> page for delivery times and charges.</p>\n\n      <h2>Returns &amp; Exchanges</h2>\n      <p>See our <a href=\"returns-exchanges.html\">Returns &amp; Exchanges</a> page for eligibility and process.</p>\n\n      <h2>Intellectual Property</h2>\n      <p>All designs, artwork and content on this website belong to ChapterByEmm and may not be reproduced or reprinted without permission.</p>\n\n      <h2>Contact</h2>\n      <p>Questions about these terms? <a href=\"contact.html\">Get in touch</a>.</p>\n    </section>", "cart.html": "<header class=\"shell page-head\">\n      <nav class=\"breadcrumbs\" aria-label=\"Breadcrumb\">\n        <a href=\"index.html\">Home</a> / <span aria-current=\"page\">Bag</span>\n      </nav>\n      <h1 style=\"font-size:var(--step-3)\">Your Bag</h1>\n      <p class=\"lede\">Physical printed T-shirts, made to order and shipped across Pakistan.</p>\n    </header>\n\n    <section class=\"shell\" style=\"padding-bottom:var(--section-y)\">\n      <div class=\"cart-layout\">\n        <div data-cart-page></div>\n\n        <aside class=\"summary\" data-cart-summary aria-label=\"Order summary\">\n          <h2>Order Summary</h2>\n          <div data-summary-rows></div>\n          <p class=\"hint\" data-ship-progress></p>\n\n          <form class=\"promo-form\" data window.__ROUTE__ = { page: "index.html", query: new URLSearchParams("") };

function go(target, push = true) {
  const [page, qs] = String(target).split("?");
  const file = VIEWS[page] !== undefined ? page : "index.html";

  window.__ROUTE__ = { page: file, query: new URLSearchParams(qs || "") };
  document.body.dataset.page = META[file].page;
  document.title = META[file].title;
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute("content", META[file].desc);

  const app = document.getElementById("app");
  app.innerHTML = '<main id="main">' + VIEWS[file] + "</main>";

  renderLayout();
  initPage();
  initForms();
  initImageFallbacks();
  initQuickAdd();
  wireEtsyLinks();
  initReveal();
  syncWishUI();
  renderCartUI();
  if (PAGE_EXTRA[file]) new Function(PAGE_EXTRA[file])();

  if (push) {
    const hash = "#/" + (file === "index.html" ? "" : file + (qs ? "?" + qs : ""));
    if (location.hash !== hash) history.pushState({ target }, "", hash);
  }
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function routeFromHash() {
  const h = location.hash.replace(/^#\/?/, "");
  return h || "index.html";
}

document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href]");
  if (!a) return;
  const href = a.getAttribute("href");
  if (!href || /^(https?:|mailto:|tel:)/.test(href)) return;
  if (href.startsWith("#")) return;
  const [page, rest] = href.split("?");
  if (!page.endsWith(".html")) return;
  e.preventDefault();
  closePanels();
  const [qs, frag] = (rest || "").split("#");
  go(page + (qs ? "?" + qs : ""));
  if (frag) {
    const el = document.getElementById(frag);
    if (el) el.scrollIntoView({ behavior: "smooth" });
  }
});

window.addEventListener("popstate", () => go(routeFromHash(), false));

document.addEventListener("DOMContentLoaded", () => {
  initStickyHeader();
  initWishlistButtons();
  initCartUI();
  go(routeFromHash(), false);
  document.dispatchEvent(new CustomEvent("cart:change"));
});
