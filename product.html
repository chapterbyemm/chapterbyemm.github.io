<body data-page="product">
  <a class="skip-link" href="#main">Skip to content</a>

  <noscript>
    <nav class="shell" aria-label="Main navigation" style="padding-block:1rem">
      <a href="index.html">Home</a> · <a href="shop.html">Shop</a> · <a href="collections.html">Collections</a> ·

  <main id="main">
    <!-- Product content is rendered from assets/js/data.js -->
    <div class="shell page-head" data-pdp></div>

    <section class="section section--tint">
      <div class="shell">
        <div class="section-head section-head--center">
          <div>
            <span class="eyebrow">Reviews</span>

          <button class="btn btn--light" type="submit">Subscribe</button>
          <p class="form-status" role="status"></p>
